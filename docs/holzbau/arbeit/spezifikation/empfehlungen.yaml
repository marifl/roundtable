# Empfehlungskatalog R5 (Kapitel 9b) mit Kulturprofilen und Ausschlussliste
# Quelle: arbeit/09b-entwurfsqualitaet-psychologie.md; Keys aus arbeit/literatur/lit-*.bib
# status: V = Wert aus geprüfter Quelle; U = Designentscheidung oder ungeprüft, vor Produktivbetrieb bestätigen
# Platzhalter in Meldungstexten: {name} wird von der App aus dem Modell gefüllt.

meta:
  katalog: empfehlungen
  version: "0.1.0"
  stand: "2026-09-27"
  kapitel: "9b"
  regelklasse: R5

evidenzgrade:
  A: {bedeutung: "Systematisches Review, Meta-Analyse mit konsistentem Befund zur Wirkung oder Leitlinie nach GRADE", laientext: "gut belegt"}
  B: {bedeutung: "Kontrollierte Einzelstudien, konsistente Beobachtungsstudien, Konsens auf Laborbasis oder Meta-Analysen nur zur Präferenz", laientext: "belegt (Studien)"}
  C: {bedeutung: "Expertenkonsens, Lehrbuch, Norm oder Bewertungssystem ohne direkte Wirkungsstudie", laientext: "bewährte Planungsregel"}
  D: {bedeutung: "Tradition oder Kulturlehre ohne empirische Prüfung", laientext: "traditionelle Lehre, nicht wissenschaftlich belegt"}

evidenzarten:
  W: {bedeutung: "Wirkung auf Gesundheit, Wohlbefinden, Leistung, Schlaf"}
  P: {bedeutung: "Präferenz: was Menschen wählen oder schön finden", max_grad: B}
  M: {bedeutung: "Markt: Zahlungsbereitschaft"}

gewichte:          # g(e) aus Kap. 9b.1.3; Designentscheidung, per Bewohnerbefragung zu kalibrieren
  status: U
  A: 1.0
  B: 0.7
  C: 0.4
  D: 0.0           # D zählt nie im Wohnqualitätsprofil, nur im Teilscore des Kulturprofils (dort Gewicht 1)

dimensionen:
  - {id: licht, name: "Licht"}
  - {id: ruhe_privatheit, name: "Ruhe und Privatheit"}
  - {id: raumklima_luft, name: "Raumklima und Innenraumluft"}
  - {id: funktion_moeblierung, name: "Funktion und Möblierbarkeit"}
  - {id: aussenbezug, name: "Außenbezug"}
  - {id: anpassbarkeit_barrierearmut, name: "Anpassbarkeit und Barrierearmut"}
  - {id: raumwirkung, name: "Raumwirkung (Vorlieben)"}
  - {id: kultur, name: "Kulturprofil (getrennter Teilscore)"}

nutzerprofile:
  - {id: homeoffice, parameter: {arbeitstage_pro_woche: "Ganzzahl 1..7"}}
  - {id: barrierefrei_vorbereitet}
  - {id: kinder, parameter: {kinder_ab_schulalter: "Ganzzahl >= 0"}}

textregeln:        # automatisch geprüft (ANF-09b-09): verbotene Wendungen je Evidenzart bzw. -grad
  P: ["ist gesünder", "schläft besser", "fördert die Gesundheit", "wissenschaftlich erwiesen"]
  C: ["wissenschaftlich erwiesen", "nachweislich"]
  D: ["ist gesünder", "fördert die Gesundheit", "wissenschaftlich", "das Chi fließt", "Energie fließt", "nachweislich"]
  D_ausnahme: "Die Wendung 'nicht wissenschaftlich belegt' ist zulässig."

empfehlungen:

  # ---------------- Ruhe und Privatheit ----------------
  - id: R5-RUHE-01
    version: "1.0"
    titel: "Schlafräume nicht an Fassaden mit hohem Nachtlärm"
    dimension: ruhe_privatheit
    evidenzgrad: A
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: lnight_schlafraum
      einheit: "dB"
      berechnung: "Lnight des Rasterpunkts der EU-Umgebungslärmkarte (4 m Höhe) vor dem lautesten Fenster des Schlafraums; nur Screening, nicht nachweistauglich (DIN 4109-2 schließt Lärmkarten aus)"
    schwellen: {strasse_lnight: 45, schiene_lnight: 44, flug_lnight: 40}
    erfuellung: "1 bei L <= Schwelle; 0 bei L >= Schwelle + 10 dB; linear dazwischen"
    erfuellung_status: U
    meldung: "An dieser Fassade liegt der nächtliche Verkehrslärm bei etwa {lnight} dB. Ab {schwelle} dB schadet Verkehrslärm nachts der Gesundheit (gut belegt). Tipp: Legen Sie Schlafräume auf die ruhigere Seite."
    quellen: [who2018noise, basner2014noise]
    status: V

  - id: R5-RUHE-02
    version: "1.0"
    titel: "Schlafzimmerfenster zur ruhigen Seite"
    dimension: ruhe_privatheit
    evidenzgrad: B
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: delta_l_schlafraum
      einheit: "dB"
      berechnung: "Lnight(Fassade des leisesten Schlafraumfensters) minus Minimum von Lnight über alle Fassaden des Gebäudes"
    schwellen: {toleranz_db: 3}
    erfuellung: "1 wenn delta_l <= Toleranz, sonst 0"
    erfuellung_status: U
    meldung: "Ihr Schlafzimmer hat kein Fenster zur ruhigsten Seite des Hauses. Studien zeigen: Wer zur ruhigen Seite schläft, schläft seltener schlecht (Studien). Tipp: Tauschen Sie das Schlafzimmer mit einem Raum auf der {ruhige_seite}-Seite."
    quellen: [ohrstrom2006quietness, bodin2015quiet, bartels2021impact, roswall2020nighttime]
    status: V

  - id: R5-RUHE-03
    version: "1.0"
    titel: "Privatheitsgradient: Schlafräume tiefer als Wohnbereich"
    dimension: ruhe_privatheit
    evidenzgrad: C
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: tiefe_differenz
      einheit: "Schritte im Raumgraphen"
      berechnung: "mittlere Tiefe der Schlafräume minus mittlere Tiefe der Wohnräume, Tiefe = kürzester Pfad ab dem Außenraumknoten im Raumgraphen (Knoten IfcSpace, Kanten Türen und Durchgänge)"
    schwellen: {min_differenz: 0.0}
    erfuellung: "1 wenn Differenz > 0, sonst 0"
    meldung: "Ein Schlafraum liegt näher am Eingang als der Wohnbereich. Bewährte Planungsregel: Private Räume liegen tiefer im Haus als die gemeinsamen."
    quellen: [altman1975environment, hanson1998decoding, alexander1977pattern]
    status: V

  - id: R5-RUHE-04
    version: "1.0"
    titel: "Kein Schlafraum als Durchgangsraum"
    dimension: ruhe_privatheit
    evidenzgrad: C
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: durchgang_schlafraum
      einheit: "boolesch"
      berechnung: "wahr, wenn ein Schlafraum auf einem kürzesten Pfad zwischen zwei anderen Räumen liegt und es keinen gleich langen Pfad ohne ihn gibt"
    schwellen: {}
    erfuellung: "1 wenn falsch, 0 wenn wahr"
    meldung: "Man muss durch {raum} gehen, um {ziel} zu erreichen. Bewährte Planungsregel: Schlafräume sind keine Durchgangsräume."
    quellen: [hanson1998decoding, alexander1977pattern]
    status: V

  - id: R5-RUHE-05
    version: "1.0"
    titel: "Rückzug und Beengtheit"
    dimension: ruhe_privatheit
    evidenzgrad: B
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: personen_je_raum
      einheit: "Personen/Raum"
      berechnung: "Haushaltsgröße geteilt durch Zahl der Aufenthaltsräume ohne Küche; zusätzlich: Zahl abschließbarer Räume minus Zahl der Personen ab Schulalter"
    schwellen: {personen_je_raum_max: 1.0, fehlende_eigene_raeume_max: 0}
    erfuellung: "Mittel aus (1 wenn Personen/Raum <= 1) und (1 wenn jede Person ab Schulalter einen eigenen abschließbaren Raum hat)"
    meldung: "Nicht jede Person ab Schulalter hat einen eigenen Raum mit Tür. Enge Wohnverhältnisse hängen in Studien mit mehr Stress zusammen, vor allem bei Kindern (Studien)."
    quellen: [evans1998crowding, evans2006child, fornara2022space]
    status: V

  # ---------------- Licht ----------------
  - id: R5-LICHT-01
    version: "1.0"
    titel: "Tageslicht nach DIN EN 17037, Stufe gering"
    dimension: licht
    evidenzgrad: B
    evidenzgrad_schwelle: C
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: tageslicht_flaechenanteil
      einheit: "%"
      berechnung: "Tageslichtsimulation je Aufenthaltsraum: Flächenanteil mit Zielbeleuchtungsstärke 300 lx und Anteil mit Mindestbeleuchtungsstärke 100 lx, jeweils für mindestens die Hälfte der Tageslichtstunden (Verfahren nach DIN EN 17037)"
    schwellen: {anteil_300lx_min: 50, anteil_100lx_min: 95}
    erfuellung: "1 wenn beide Anteile erreicht; sonst Mittel der Erfüllungsquoten (Istanteil / Sollanteil, max. 1)"
    meldung: "{raum} bekommt eher wenig Tageslicht. Tageslicht tut Schlaf und Stimmung gut (Studien); die Zielwerte sind eine bewährte Planungsregel. Tipp: größeres oder zusätzliches Fenster, zum Beispiel an einer zweiten Wand."
    quellen: [aries2015daylight, din2019tageslicht, din5034-1]
    status: V

  - id: R5-LICHT-02
    version: "1.0"
    titel: "Besonnung mindestens eines Wohnraums"
    dimension: licht
    evidenzgrad: C
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: besonnungsdauer
      einheit: "h"
      berechnung: "Sonnenstandssimulation für einen Stichtag zwischen 1.2. und 21.3., Maximum über alle Wohnräume"
    schwellen: {min_h: 1.5}
    erfuellung: "1 wenn Dauer >= 1,5 h, sonst Dauer / 1,5 h"
    meldung: "Kein Wohnraum bekommt im Spätwinter mindestens 1,5 Stunden Sonne. Bewährte Planungsregel: Mindestens ein Wohnraum sollte besonnt sein."
    quellen: [din2019tageslicht]
    status: V

  - id: R5-LICHT-03
    version: "1.0"
    titel: "Schlafräume vollständig verdunkelbar"
    dimension: licht
    evidenzgrad: B
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: verdunkelbar_anteil
      einheit: "%"
      berechnung: "Anteil der Fenster in Schlafräumen mit Rollladen, Raffstore oder Verdunkelungsbehang im Modell"
    schwellen: {min_anteil: 100}
    erfuellung: "Anteil / 100"
    meldung: "Nicht alle Fenster in {raum} lassen sich verdunkeln. Dunkelheit in der Nacht unterstützt den Tag-Nacht-Rhythmus (Studien). Tipp: Rollläden oder Raffstores wählen."
    quellen: [brown2022recommendations, cajochen2022evening, cain2020evening]
    status: V

  - id: R5-LICHT-04
    version: "1.0"
    titel: "Tagesarbeitsplatz in der Fensterzone"
    dimension: licht
    evidenzgrad: B
    evidenzart: W
    profil: evidenzbasiert
    nutzerprofil: homeoffice
    status_n: false
    kennzahl:
      name: tageslicht_arbeitsplatz
      einheit: "lx"
      berechnung: "simulierte Tageslicht-Beleuchtungsstärke (horizontal, 0,75 m) am Schreibtischplatz, erreicht in mindestens der Hälfte der Tageslichtstunden"
    schwellen: {min_lx: 300}
    erfuellung: "1 wenn Wert >= 300 lx, sonst Wert / 300"
    erfuellung_status: U
    meldung: "Ihr Schreibtisch steht weit vom Fenster. Viel Tageslicht am Tag unterstützt Wachheit und Tag-Nacht-Rhythmus (Studien). Tipp: Schreibtisch näher ans Fenster."
    quellen: [brown2022recommendations, brown2020melanopic, din2019tageslicht]
    status: U
    hinweis_status: "Schwelle in Analogie zu DIN EN 17037 übertragen; mEDI am Auge ist im Grundrissstadium nicht berechenbar"

  # ---------------- Raumklima und Innenraumluft ----------------
  - id: R5-KLIMA-01
    version: "1.0"
    titel: "Überhitzung von Schlafräumen mit West- und Südwestverglasung"
    dimension: raumklima_luft
    evidenzgrad: B
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: westverglasung_ohne_sonnenschutz
      einheit: "m²"
      berechnung: "Summe der Glasflächen in Schlafräumen mit Azimut der Fensternormalen 202,5° bis 292,5° (bezogen auf geografisch Nord), die keinen außenliegenden Sonnenschutz haben"
    schwellen: {max_m2: 0.0}
    erfuellung: "1 wenn Fläche = 0; sonst 0"
    meldung: "{raum} hat große Fenster nach {richtung} ohne Sonnenschutz außen. Im Sommer heizt sich der Raum abends auf, und Hitze stört den Schlaf (Studien). Tipp: außenliegende Raffstores oder Rollläden."
    konflikte: [VA-04]
    quellen: [emmitt2023bedroom, lan2017thermal, din4108-2]
    status: V
    hinweis_status: "Der Nachweis des sommerlichen Wärmeschutzes nach DIN 4108-2 ist eine harte Regel (Regelkatalog), diese Empfehlung ergänzt ihn."

  - id: R5-KLIMA-02
    version: "1.0"
    titel: "Schadstoffarme Materialien nach QNG"
    dimension: raumklima_luft
    evidenzgrad: A
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: qng_anteil
      einheit: "%"
      berechnung: "Anteil der Innenraumprodukte (Bemusterung, Kap. 12) mit Nachweis nach QNG Anhang 313 am Gesamtbestand der Innenraumprodukte"
    schwellen: {min_anteil: 100}
    erfuellung: "Anteil / 100"
    meldung: "{anzahl} gewählte Produkte haben keinen Schadstoffnachweis nach QNG. Schadstoffe wie Formaldehyd belasten die Raumluft (gut belegt). Tipp: geprüfte Alternative wählen."
    quellen: [qng2023anlage3, air2016formaldehyd]
    status: V

  - id: R5-KLIMA-03
    version: "1.0"
    titel: "Radonvorsorge"
    dimension: raumklima_luft
    evidenzgrad: A
    evidenzart: W
    profil: evidenzbasiert
    status_n: true
    kennzahl:
      name: radonvorsorgegebiet
      einheit: "boolesch"
      berechnung: "Grundstück liegt in einem festgelegten Radonvorsorgegebiet (Geodatenabfrage der Landesbehörde); Bodenplatte als radonsicher ausgeführt (Merkmal am Bauteil)"
    schwellen: {referenzwert_bq_m3: 300}
    erfuellung: "1 wenn nicht im Gebiet oder Bodenplatte radonsicher, sonst 0"
    meldung: "Ihr Grundstück liegt in einem Radonvorsorgegebiet. Radon ist ein Gesundheitsrisiko (gut belegt). Wir sehen deshalb eine radonsichere Bodenplatte vor und empfehlen nach dem Einzug eine Messung."
    quellen: [bfs2025radon]
    status: V

  # ---------------- Funktion und Möblierbarkeit ----------------
  - id: R5-FUNKTION-01
    version: "1.0"
    titel: "Möblierbarkeit mit Bettmodul (WBS K18)"
    dimension: funktion_moeblierung
    evidenzgrad: C
    evidenzart: W
    profil: evidenzbasiert
    status_n: false
    kennzahl:
      name: bettstellungen
      einheit: "Anzahl je Zimmer"
      berechnung: "Je Zimmer Zahl der Stellungen eines Bettmoduls (Doppelbett ab 12 m², Einzelbett ab 10 m²) mit Kopfende an einer Wand, bei denen kein Tür- oder Fensterflügel bei 90° Öffnung in die Bettfläche ragt; Mittel über alle Zimmer"
    schwellen: {min_je_zimmer: 1}
    erfuellung: "Anteil der Zimmer mit mindestens einer gültigen Stellung"
    meldung: "In {raum} passt kein Bett so, dass Tür und Fenster frei aufgehen. Bewährte Planungsregel. Tipp: Tür versetzen, anderen Flügel wählen oder Raum verbreitern."
    quellen: [bwo2015wbs]
    status: V

