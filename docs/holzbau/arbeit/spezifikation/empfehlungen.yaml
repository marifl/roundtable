    aussetzbar_durch_kunde: true
    meldung: "Die meisten Menschen stellen das Bett so, dass sie die Tür sehen und möglichst weit von ihr entfernt liegen. Das ist eine gut belegte Vorliebe, eine Wirkung auf den Schlaf ist nicht untersucht (Studien zu Vorlieben)."
