- id: DE.DWA-A138-1.Durchlaessigkeit
  version: 0.1.0
  titel: Durchlässigkeit und Korrekturfaktor
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DWA-A 138-1", fundstelle: "k_i = k_f · f_Ort · f_Methode; Regelbereich k_f", fassung: "2024-10", status: U, recherche: ["18"]}
  profil: {name: DE-aRdT-Entwaesserung, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-10-01", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "Versickerungsanlage"
    r2_voraussetzung: [HRB-R2-Sickertest]
  eingaben:
    - {name: k_f, einheit: "m/s", quelle: Sickertest}
    - {name: f_ort, einheit: "-", quelle: "Anzahl/Verteilung der Versuche"}
    - {name: f_methode, einheit: "-", quelle: Versuchsverfahren}
  pruefung:
    typ: rechnung
    funktion: durchlaessigkeit@0.1
    formel: "k_i = k_f · min(1, f_ort · f_methode); verletzt, wenn k_f außerhalb 1e-6 bis 1e-3 m/s; nur Bodenansprache ohne Versuch: unbestimmt"
    parameter: {k_f_min: 1.0e-6, k_f_max: 1.0e-3}
  grenzwerte:
    - {name: k_f_bereich, wert: [1.0e-6, 1.0e-3], einheit: "m/s", richtung: intervall, fundstelle: "DWA-A 138-1 (SBZ 05/2025)", status: V}
  meldung: "Die Durchlässigkeit k_f = {k_f:.1e} m/s liegt außerhalb des Regelbereichs; eine Versickerung nach DWA-A 138-1 ist so nicht bemessbar."
  alternative:
    - {art: A3_variante, beschreibung: "Bodenaustausch (bei k_f >= 1e-3 im Sickerkegel 1 m) oder anderer Standort", frei: [versickerung.lage]}
  status: U
  beispiel: [B17]
  kapitel: "14a.2.2"
  anforderungen: [ANF-14a-13]
