  profil: {name: BY-Wasserrecht-NWFreiV, version: 0.1.0}
  schicht: S1
  geltung:
    raum: Bayern
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "Versickerungsanlage vom Typ Rigole oder Sickerschacht"
  eingaben:
    - {name: a_mulde_erf, einheit: "m²", quelle: "Muldenbemessung (Bisektion)"}
    - {name: a_zulaessig, einheit: "m²", quelle: "zulässige Fläche nach Abständen"}
    - {name: a_e, einheit: "m²", quelle: Modell}
    - {name: begruendung, einheit: "-", quelle: Entwurfsverfasser}
  pruefung:
    typ: optimierung
    funktion: flaechenvorrang@0.1
    formel: "A_S = max(hydraulisch erforderlich, a_e/15); passt eine Mulde mit A_S und Oberboden >= 20 cm auf a_zulaessig, ist Rigole/Schacht freigabepflichtig (Begründung im Antrag), sonst erfuellt"
    parameter: {anteil_min: 0.0667, oberboden_min_m: 0.20, einstau_max_m: 0.30}
  grenzwerte:
