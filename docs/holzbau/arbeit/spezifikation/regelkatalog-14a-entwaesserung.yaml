  meldung: "Eine Mulde mit {A_S:.1f} m² passt auf das Grundstück. Die Rigole ist nach NWFreiV § 3 Abs. 2 nur zulässig, wenn flächenhaft nicht versickert werden kann; bitte begründen oder Mulde wählen."
  alternative:
    - {art: A3_variante, beschreibung: "Mulde statt Rigole", frei: [versickerung.typ]}
    - {art: A5_freigabeweg, beschreibung: "Begründung im Antrag durch den Entwurfsverfasser"}
