- id: BY.M-MSE.Baum-Sparten
  version: 0.1.0
  titel: Darstellung geschützter Gehölze und Sparten im Entwässerungsplan
  klasse: R2
  haerte: hinweis
  quelle: {art: G, werk: "MSE-Genehmigungsantrag; MSE-Leitfaden", fundstelle: "Antrag Ziff. 3; Leitfaden 3.2", fassung: "2023; 2026-06-08", status: V, recherche: ["18"]}
  profil: {name: BY-M-EWS-2024-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "Leitungsnetz und IfcGeographicElement Bäume, Spartentrassen"
  eingaben:
    - {name: abstand_baum_leitung, einheit: m, quelle: Modell}
    - {name: kreuzungen_sparten, einheit: "-", quelle: Modell}
  pruefung:
    typ: vollstaendigkeit
    funktion: baum_sparten@0.1
    formel: "geschützte Gehölze mit Abstand <= 5 m zur Leitungsachse im Plan 1:100 darstellen; jede Spartenkreuzung eintragen; Wurzelbereich Kronentraufe + 1,5 m als hartes Hindernis [U]"
