  hinweis: "B17-Prüfpunkt NW-01: k_f 1e-5, k_i 7,2e-6 (f_k 0,72). Tabellen f_Ort, f_Methode lizenzpflichtig."

- id: DE.DWA-A138-1.Rigole-Speicher
  version: 0.1.0
  titel: Bemessung der Rigole im einfachen Verfahren
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DWA-A 138-1; DWA-A 117", fundstelle: "einfaches Verfahren; Rigole 6.4.2 (Sickerfläche mit Stirnflächen)", fassung: "2024-10", status: U, recherche: ["18"]}
  profil: {name: DE-aRdT-Entwaesserung, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-10-01", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcDistributionChamberElement USERDEFINED Versickerungsrigole"
    r2_voraussetzung: [HRB-R2-KOSTRA-Rasterfeld]
  eingaben:
    - {name: A_C, einheit: "m²", quelle: Modell}
    - {name: k_i, einheit: "m/s", quelle: DE.DWA-A138-1.Durchlaessigkeit}
    - {name: r_D, einheit: "l/(s·ha)", quelle: "KOSTRA-DWD-2020, T = 5 a"}
    - {name: b, einheit: m, quelle: Produkt}
    - {name: h, einheit: m, quelle: Produkt}
    - {name: s_R, einheit: "-", quelle: Produkt}
    - {name: f_Z, einheit: "-", quelle: Parameter}
  pruefung:
    typ: rechnung
    funktion: rigole_a138@0.1
    formel: "A_S,m = b·L + h·(L + b); Q_S = k_i·A_S,m·1e3; L_erf = max_D [A_C·1e-7·r_D − b·h·k_i − Q_Dr·1e-3 − V_Sch/(D·60·f_Z)] / [b·h·s_R/(D·60·f_Z) + (b + h)·k_i], D = 5 … 4320 min; V_erf = max_D (r_D·A_C·1e-4 − Q_S)·D·60·f_Z·1e-3 <= V_vorh = s_R·b·h·L"
    parameter: {D_min: 5, D_max: 4320, T_a: 5, f_Z: [1.1, 1.2]}
  grenzwerte: []
  meldung: "Die Rigole ist mit {L:.2f} m zu kurz; erforderlich sind {L_erf:.2f} m (V_erf {V_erf:.2f} m³ > V_vorh {V_vorh:.2f} m³)."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Rigole auf L_erf verlängern oder zweite Reihe", frei: [rigole.L, rigole.reihen]}
  status: V
  beispiel: [B17]
  kapitel: "14a.2.2"
  anforderungen: [ANF-14a-13]
  tests: [tests/test_b17.py::test_rigole_speicher_gegen_veroeffentlichte_rechnung, tests/test_b17.py::test_rigolenlaenge_gegen_veroeffentlichte_rechnung, tests/test_b17.py::test_laenge_und_speicher_konsistent, tests/test_b17.py::test_rigole_bemessung_standard]
  hinweis: "B17-Prüfpunkt NW-15. Nachrechnung 40,52 m³ und 27,45 m exakt; B17: L_erf 9,29 m -> 9,60 m, V_erf 4,61 <= 4,82 m³."

