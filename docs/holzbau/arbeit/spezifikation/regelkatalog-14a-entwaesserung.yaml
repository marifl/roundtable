# Regelkatalog Kapitel 14a: Grundstücksentwässerung und Außenanlagen (Referenz München).
# Schema: regel.schema.json (#/$defs/regel). Ergebniswerte: erfuellt | verletzt | unbestimmt |
# nicht_anwendbar | freigabepflichtig (Kapitel 9.2.1).
# Zuordnung zu den Prüfpunkten von B17 (SW-01 ... NW-15) im Feld "hinweis".
# Normwerte aus DIN 1986-100 und DWA-A 138-1 stammen aus Sekundärquellen und kommunalen Merkblättern
# (Recherche 18); Tabellenwerte (C_m, f_Ort, f_Methode, Schachtmaße) sind lizenzpflichtig (DAT-14a).
# Neu verwendete Profile, in regelprofile.yaml noch nachzutragen:
#   BY-M-EWS-2024-05 (S1, Entwässerungssatzung München), BY-Wasserrecht-NWFreiV (S1), DE-aRdT-Entwaesserung (S3).

katalog:
  name: HRB-Regelkatalog-14a-Entwaesserung
  version: 0.1.0
  stand: "2026-09-27"
  kapitel: ["14a"]
  hinweis: "Regeln aus Kapitel 14a (Recherche 18, Beispiel B17). Anforderungen ANF-14a-xx in Abschnitt 14a.8.2."

regeln:

- id: BY.M-EWS.Formblatt
  version: 0.1.0
  titel: Technisches Formblatt des Netzbetreibers als Eingabe
  klasse: R2
  haerte: hart
  quelle: {art: G, werk: "Entwässerungssatzung München (EWS); MSE-Leitfaden Grundstücksentwässerung", fundstelle: "EWS § 9 Abs. 2; Leitfaden 2.2, Abb. 1", fassung: "EWS 2018-08-28 i. d. F. 2024-05-08; Leitfaden 7. Aufl. 2026-06-08", status: V, recherche: ["18"]}
  profil: {name: BY-M-EWS-2024-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: "2024-05-08", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcSite mit Grundstücksentwässerung"
  eingaben:
    - {name: formblatt, einheit: "-", quelle: "IfcDocumentReference mit SHA-256", beschreibung: "Anschlusspunkt, Einlassstück mit Sohle, DN, Kanalart, RSE, WSG, Altlast, NW-Vorgabe, Höhenbetrag DHHN12 -> DHHN2016"}
  pruefung:
    typ: vollstaendigkeit
    funktion: formblatt@0.1
    formel: "alle Pflichtfelder vorhanden und Dokument-Hash gesetzt; sonst unbestimmt für alle abhängigen Regeln (Revisionsschacht, Anschlusskanal, Rückstau, NWFreiV § 1)"
  grenzwerte: []
  meldung: "Das Technische Formblatt fehlt oder ist unvollständig ({fehlend}). Anschluss und Niederschlagswasser können nicht geprüft werden."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "Formblatt beim Erschließungsbüro MSE-421 anfordern"}
  status: V
  beispiel: [B17]
  kapitel: "14a.1.2"
  anforderungen: [ANF-14a-01, ANF-14a-02]

- id: BY.M-EWS.8-3.Frosttiefe
  version: 0.1.0
  titel: Frostfreie Verlegetiefe
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: "EWS München; MSE-Leitfaden", fundstelle: "EWS § 8 Abs. 3; Leitfaden 2.7", fassung: "2024-05-08", status: V, recherche: ["18"]}
  profil: {name: BY-M-EWS-2024-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: "2024-05-08", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "erdverlegte IfcPipeSegment der Systeme SEWAGE, RAINWATER, STORMWATER"
    r2_voraussetzung: [BY-R2-Gelaende-DGM]
  eingaben:
    - {name: gok, einheit: "m NHN", quelle: DGM}
    - {name: sohle, einheit: "m NHN", quelle: Modell}
    - {name: system, einheit: "-", quelle: Modell}
  pruefung:
    typ: geometrie
    funktion: frosttiefe@0.1
    formel: "je Knoten außerhalb des Gebäudes: gok − sohle >= 1,20 m (Schmutzwasser); >= 0,80 m (Niederschlagsleitung zur Versickerung)"
    parameter: {frosttiefe_sw_m: 1.20, frosttiefe_nw_versickerung_m: 0.80}
  grenzwerte:
    - {name: frosttiefe_sw, wert: 1.20, einheit: m, richtung: min, fundstelle: "Leitfaden 2.7", status: V}
    - {name: frosttiefe_nw, wert: 0.80, einheit: m, richtung: min, fundstelle: "Leitfaden 2.7 (DIN 1986-100 5.6)", status: V}
  meldung: "Die Leitung liegt bei {knoten} nur {ist:.2f} m unter Gelände; gefordert sind {soll:.2f} m bis Rohrsohle."
  alternative:
    - {art: A2_kompensation, beschreibung: "Leitung tiefer legen (Höhenplan neu rechnen)", frei: [haltung.sohle]}
  status: V
  beispiel: [B17]
  kapitel: "14a.1.2"
  anforderungen: [ANF-14a-03]
  tests: [tests/test_b17.py::test_hoehenplan_regeln]
  hinweis: "B17-Prüfpunkte SW-03, NW-12."

- id: DE.DIN1986-100.Gefaelle
  version: 0.1.0
  titel: Mindest- und Höchstgefälle von Grundleitungen
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 1986-100; kommunale Merkblätter", fundstelle: "Mindestgefälle innen 0,5 %, außen 1:DN; Höchstgefälle 1:20", fassung: "2016-12", status: U, recherche: ["18", "08"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2016-12-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcPipeSegment Grundleitung"
  eingaben:
    - {name: gefaelle, einheit: "-", quelle: "Pset_PipeSegmentOccurrence.Gradient"}
    - {name: dn, einheit: mm, quelle: Typ}
    - {name: lage, einheit: "-", quelle: Modell, beschreibung: "GEBAEUDE oder ERDREICH"}
  pruefung:
    typ: rechnung
    funktion: gefaelle@0.1
    formel: "GEBAEUDE: gefaelle >= 0,005; ERDREICH: gefaelle >= 1/DN; stets gefaelle <= 0,05 (sonst Absturzbauwerk)"
    parameter: {min_gebaeude: 0.005, max: 0.05}
  grenzwerte:
    - {name: gefaelle_min_gebaeude, wert: 0.005, einheit: "-", richtung: min, fundstelle: "DIN 1986-100 (Sekundärquelle)", status: V}
    - {name: gefaelle_max, wert: 0.05, einheit: "-", richtung: max, fundstelle: "kommunale Merkblätter", status: U}
  meldung: "Die Haltung {id} hat {ist:.2%} Gefälle; zulässig sind {min:.2%} bis {max:.2%}."
  alternative:
    - {art: A2_kompensation, beschreibung: "Sohlhöhen anpassen", frei: [haltung.sohle]}
  status: U
  beispiel: [B17]
  kapitel: "14a.1.1"
  anforderungen: [ANF-14a-04]
  tests: [tests/test_b17.py::test_hoehenplan_regeln]
  hinweis: "B17-Prüfpunkte SW-04, SW-05."

- id: DE.DIN1986-100.Nennweite-Hydraulik
  version: 0.1.0
  titel: Nennweite und hydraulische Leistungsfähigkeit
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 1986-100", fundstelle: "6.1.8; 14.1.5; Tab. A.3", fassung: "2016-12", status: U, recherche: ["18", "08"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2016-12-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcDistributionSystem SEWAGE"
  eingaben:
    - {name: sum_du, einheit: "l/s", quelle: TGA}
    - {name: dn, einheit: mm, quelle: Typ}
    - {name: gefaelle, einheit: "-", quelle: Modell}
    - {name: lage, einheit: "-", quelle: Modell}
  pruefung:
    typ: rechnung
    funktion: hydraulik_sw@0.1
    formel: "Q_ww = max(0,5·sqrt(ΣDU), DU_max); Q_voll nach Prandtl-Colebrook (k_b = 1 mm, nu = 1,31e-6 m²/s); Q_zul = 0,500·Q_voll (h/d 0,5 innen) bzw. 0,837·Q_voll (h/d 0,7 außen); verletzt, wenn Q_ww > Q_zul oder DN in Fließrichtung abnimmt oder DN < 100"
    parameter: {K: 0.5, k_b_mm: 1.0, nu_m2_s: 1.31e-6, faktor_hd05: 0.500, faktor_hd07: 0.837, dn_min: 100}
  grenzwerte:
    - {name: dn_min, wert: 100, einheit: mm, richtung: min, fundstelle: "DIN 1986-100 (Sekundärquelle)", status: V}
    - {name: fuellungsgrad_innen, wert: 0.5, einheit: "-", richtung: max, fundstelle: "DIN 1986-100 (Sekundärquelle)", status: V}
    - {name: fuellungsgrad_aussen, wert: 0.7, einheit: "-", richtung: max, fundstelle: "DIN 1986-100 (Sekundärquelle)", status: V}
  meldung: "Die Haltung {id} ist mit {ausl:.0%} ausgelastet oder verringert die Nennweite in Fließrichtung."
  alternative:
    - {art: A3_variante, beschreibung: "größere Nennweite oder mehr Gefälle", frei: [haltung.dn, haltung.gefaelle]}
  status: U
  beispiel: [B17]
  kapitel: "14a.1.1"
  anforderungen: [ANF-14a-05]
  tests: [tests/test_b17.py::test_schmutzwasserabfluss, tests/test_b17.py::test_teilfuellung_und_prandtl_colebrook]
  hinweis: "B17-Prüfpunkte SW-07, SW-08; Referenz Q_ww 2,0 l/s, Auslastung 0,23."

- id: DE.DIN1986-100.Reinigungsoeffnung
  version: 0.1.0
  titel: Reinigungsöffnungen und Schächte
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 1986-100; kommunale Merkblätter (Schächte 2023/01)", fundstelle: "6.6 (Wortlaut nicht eingesehen)", fassung: "2016-12", status: U, recherche: ["18"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2016-12-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "Leitungsnetz SEWAGE und RAINWATER"
  eingaben:
    - {name: knoten, einheit: "-", quelle: Modell}
    - {name: abstand_zwischen_oeffnungen, einheit: m, quelle: Modell}
    - {name: richtungsaenderung, einheit: "°", quelle: Modell}
    - {name: einbautiefe, einheit: m, quelle: Modell}
  pruefung:
    typ: topologie
    funktion: reinigungsoeffnungen@0.1
    formel: "Öffnung am Fuß jeder Fallleitung, an jeder Zusammenführung und Richtungsänderung > 45° außerhalb des Gebäudes; Abstand <= 20 m (< DN 150) bzw. <= 40 m (>= DN 150); Schachtgröße aus Einbautiefe (DN 400 <= 1,2 m, DN 600 <= 1,6 m, DN 800 <= 1,8 m, DN 1000 <= 2,2 m, darüber Einsteigschacht)"
    parameter: {abstand_klein_m: 20, abstand_gross_m: 40, winkel_grad: 45, schacht_tiefen_m: {"400": 1.2, "600": 1.6, "800": 1.8, "1000": 2.2}}
  grenzwerte:
    - {name: abstand_bis_dn150, wert: 20, einheit: m, richtung: max, fundstelle: "kommunale Merkblätter", status: U}
    - {name: abstand_ab_dn150, wert: 40, einheit: m, richtung: max, fundstelle: "kommunale Merkblätter", status: U}
    - {name: richtungsaenderung, wert: 45, einheit: "°", richtung: max, fundstelle: "kommunale Merkblätter", status: U}
  meldung: "Zwischen {a} und {b} fehlt eine Reinigungsöffnung ({grund})."
  alternative:
    - {art: A2_kompensation, beschreibung: "Schacht oder Reinigungsöffnung ergänzen", frei: [netz.schaechte]}
  status: U
  beispiel: [B17]
  kapitel: "14a.1.1"
  anforderungen: [ANF-14a-06]
  tests: [tests/test_b17.py::test_schaechte]
  hinweis: "B17-Prüfpunkt SW-09. Schachtmaße aus kommunalem Merkblatt, nicht aus DIN 1986-100 Tab. 3."

- id: BY.M-EWS.8-4.Revisionsschacht
  version: 0.1.0
  titel: Revisionsschacht am Ende der Grundstücksentwässerungsanlage
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: "EWS München; MSE-Leitfaden", fundstelle: "EWS § 8 Abs. 4, § 3 Nr. 9; Leitfaden 2.6", fassung: "2024-05-08", status: V, recherche: ["18"]}
  profil: {name: BY-M-EWS-2024-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: "2024-05-08", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcDistributionSystem SEWAGE"
    r2_voraussetzung: [BY-R2-Grundstuecksgrenze]
  eingaben:
    - {name: schacht_lage, einheit: "m (Punkt)", quelle: Modell}
    - {name: abstand_grenze_gebaeude, einheit: m, quelle: Modell}
  pruefung:
    typ: geometrie
    funktion: revisionsschacht@0.1
    formel: "genau ein Revisionsschacht am Ende der Anlage, vollständig auf eigenem Grund; außenliegend nur, wenn abstand_grenze_gebaeude >= 5 m, sonst Reinigungsöffnung im Gebäude"
    parameter: {vorgarten_min_m: 5.0, dn_revisionsschacht: 1000}
  grenzwerte:
    - {name: vorgarten, wert: 5.0, einheit: m, richtung: min, fundstelle: "Leitfaden 2.6", status: V}
  meldung: "Der Revisionsschacht liegt nicht vollständig auf eigenem Grund oder im zu schmalen Vorgarten ({ist:.2f} m < 5,00 m)."
  alternative:
    - {art: A3_variante, beschreibung: "Reinigungsöffnung im Gebäude statt Außenschacht", frei: [netz.revisionsschacht]}
  status: V
  beispiel: [B17]
  kapitel: "14a.1.3"
  anforderungen: [ANF-14a-07]
  tests: [tests/test_b17.py::test_schaechte]
  hinweis: "B17-Prüfpunkte SW-01, SW-02 (Vorgarten 9,00 m, Schacht DN 1000 bei (8,00; 1,00))."

- id: BY.M-EWS.9.Anschlusskanal
  version: 0.1.0
  titel: Führung und Gefälle des Anschlusskanals
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: "EWS München; MSE-Leitfaden", fundstelle: "EWS § 8 Abs. 5, § 9; Leitfaden 2.6, 3.2", fassung: "2024-05-08", status: V, recherche: ["18"]}
  profil: {name: BY-M-EWS-2024-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: "2024-05-08", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcPipeSegment Anschlusskanal zwischen Revisionsschacht und Einlassstück"
    r2_voraussetzung: [BY.M-EWS.Formblatt]
  eingaben:
    - {name: sohle_revisionsschacht, einheit: "m NHN", quelle: Modell}
    - {name: sohle_einlass, einheit: "m NHN", quelle: Formblatt}
    - {name: laenge, einheit: m, quelle: Modell}
    - {name: dn, einheit: mm, quelle: Formblatt}
  pruefung:
    typ: rechnung
    funktion: anschlusskanal@0.1
    formel: "geradlinig ohne Gefällewechsel; 1/DN <= (sohle_revisionsschacht − sohle_einlass)/laenge <= 1; sonst verletzt mit Auflage Hebeanlage (EWS § 8 Abs. 5)"
    parameter: {gefaelle_max: 1.0}
  grenzwerte:
    - {name: gefaelle_max, wert: 1.0, einheit: "-", richtung: max, fundstelle: "Leitfaden 2.6", status: V}
  meldung: "Der Anschlusskanal hätte {ist:.1%} Gefälle; ein Freispiegelabfluss ist nicht möglich. Das Gebäude braucht eine Hebeanlage."
  alternative:
    - {art: A3_variante, beschreibung: "Hebeanlage für das Gebäude vorsehen", frei: [netz.hebeanlage]}
    - {art: A5_freigabeweg, beschreibung: "anderen Anschlusspunkt bei der MSE anfragen"}
  status: V
  beispiel: [B17]
  kapitel: "14a.1.3"
  anforderungen: [ANF-14a-08]
  tests: [tests/test_b17.py::test_kanal_zu_hoch_hebeanlage]
  hinweis: "B17-Prüfpunkt SW-06: bodenplatte 43 % erfüllt; kanal_hoch −2,6 % Verstoß."

- id: BY.M-EWS.8-6.Rueckstau
  version: 0.1.0
  titel: Sicherung gegen Rückstau
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: "EWS München; MSE-Faltblatt; DIN EN 12056-4, DIN EN 12050, DIN EN 13564", fundstelle: "EWS § 8 Abs. 6; Leitfaden 2.2/2.3", fassung: "2024-05-08", status: V, recherche: ["18"]}
  profil: {name: BY-M-EWS-2024-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: "2024-05-08", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "Ablaufstellen (IfcSanitaryTerminal, IfcWasteTerminal)"
    r2_voraussetzung: [BY.M-EWS.Formblatt]
  eingaben:
    - {name: hoehe_ablaufstelle, einheit: "m NHN", quelle: Modell}
    - {name: rse, einheit: "m NHN", quelle: "Formblatt, sonst Straßenoberkante"}
    - {name: faekalienhaltig, einheit: "-", quelle: Modell}
    - {name: sicherung, einheit: "-", quelle: Modell}
  pruefung:
