    formel: "erlaubnisfrei nur, wenn nicht WSG/Heilquellenschutz/Altlast (§ 1), kein Umgang mit wassergefährdenden Stoffen außer Kleingebinde <= 20 l (§ 2), a_befestigt <= 1000 m² je Anlage (§ 3 Abs. 1), a_metall_unbeschichtet <= 50 m² oder bauartzugelassene Anlage (§ 3 Abs. 2); sonst verletzt (Erlaubnis erforderlich)"
