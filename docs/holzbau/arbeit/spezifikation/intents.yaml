gruppen:
- gruppe: grundriss
  beschreibung: Räume anlegen, ändern, verschieben, zusammenlegen und teilen
  frage:
    id: q.intent.grundriss
    typ: choice
    text: Welche Aktion ist gemeint?
    optionen: [raum_groesse_aendern, raum_hinzufuegen, raum_entfernen, raum_verschieben, raeume_tauschen, raum_nutzung_aendern, raeume_zusammenlegen, raum_teilen, innenwand_versetzen,
      innentuer_setzen]
    schwelle: risikoklasse
    hinweis: Schwelle tau_k und Abstand delta_k der Risikoklasse des besten Intents; Kontextfilter entfernt unzulässige Optionen
  intents:
  - intent: raum_groesse_aendern
    beschreibung: Breite, Tiefe oder Fläche eines Raums absolut oder relativ ändern; Nachbarraum gleicht aus
    risikoklasse: R1
    beispielsaetze: [Mach die Küche dreißig Zentimeter breiter, Das Arbeitszimmer soll vierzehn Quadratmeter haben, Kannst du das Schlafzimmer einen halben Meter tiefer machen, Das Bad
        im Obergeschoss etwas größer bitte]
    slots:
    - {name: raum, typ: raumref, pflicht: true}
    - name: groesse
      typ: enum
      pflicht: true
      werte: [breite, tiefe, flaeche]
      quelle: modell
      frage: q.groesse
    - name: wert
      typ: laenge|flaeche
      pflicht: false
      einheit: m|m²
      wertebereich:
        laenge: [0.05, 15.0]
        flaeche: [1.0, 80.0]
    - {name: modus, typ: modus, pflicht: false}
    - {name: himmelsrichtung, typ: himmelsrichtung, pflicht: false}
    - {name: staerke, typ: staerke, pflicht: false, hinweis: 'nur wenn kein Zahlwert erkannt; Stufe → Schrittweite aus Tabelle, immer mit Vorschau'}
    fragen:
    - id: q.groesse
      typ: choice
      text: Welche Größe des Raums soll sich ändern?
      optionen: [breite, tiefe, flaeche]
      schwelle: 0.7
    - {id: n.relativ, typ: noul, text: 'Soll der Wert um einen Betrag geändert werden, statt auf einen Zielwert gesetzt zu werden?', schwelle: 0.7, wirkung: 'modus = relativ, wenn der
        Parser keinen Modus erkennt'}
    - id: s.staerke
      typ: score
      text: Wie stark soll die Änderung sein?
      stufen: [sehr wenig, etwas, deutlich, stark, sehr stark]
      schwelle: 0.6
    regeln: [M.Projekt.Raum-Mindestmasse, BY.BayBO.45.Fensterflaeche, DE.WoFlV.Wohnflaeche, DE.VDI6000.Bewegungsflaeche, R5-FUNKTION-01, R5-FUNKTION-06]
    module: [grundriss_solver, regelmaschine, kosten, energie, ifc_generator]
    rueckfrage: 'Welchen Raum meinen Sie: {kandidaten}? Und um wie viel, zum Beispiel „zwanzig Zentimeter breiter“?'
  - intent: raum_hinzufuegen
    beschreibung: neuen Raum mit Nutzung, Geschoss und optionaler Größe anlegen
    risikoklasse: R1
    beispielsaetze: [Ich hätte gern noch ein Gästezimmer oben, Füge im Erdgeschoss eine Speisekammer hinzu, Wir brauchen ein Arbeitszimmer mit etwa zehn Quadratmetern]
    slots:
    - name: nutzung
      typ: enum
      pflicht: true
      quelle: modell
      werte: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      frage: q.nutzung
    - {name: geschoss, typ: geschossref, pflicht: false}
    - name: wert
      typ: flaeche
      pflicht: false
      einheit: m²
      wertebereich: [2.0, 60.0]
    - {name: himmelsrichtung, typ: himmelsrichtung, pflicht: false}
    fragen:
    - id: q.nutzung
      typ: choice
      text: Welche Nutzung soll der neue Raum haben?
      optionen: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      schwelle: 0.7
    regeln: [M.Projekt.Raum-Mindestmasse, BY.BayBO.45.Fensterflaeche, DE.WoFlV.Wohnflaeche, BY.BayBO.2-3.Gebaeudeklasse, R5-RUHE-03]
    module: [grundriss_solver, regelmaschine, kosten, ifc_generator]
    rueckfrage: Welcher Raum soll dazukommen, und in welches Geschoss?
  - intent: raum_entfernen
    beschreibung: Raum entfernen; Fläche fällt einem Nachbarraum zu
    risikoklasse: R2
    beispielsaetze: [Die Ankleide brauchen wir nicht, Lösch das Gäste-WC unten, Das zweite Kinderzimmer kann weg]
    slots:
    - {name: raum, typ: raumref, pflicht: true}
    - {name: empfaenger, typ: raumref, pflicht: false, hinweis: 'Raum, der die Fläche erhält; sonst Vorschlag des Solvers'}
    fragen: []
    regeln: [M.Projekt.Raum-Mindestmasse, DE.WoFlV.Wohnflaeche, R5-FUNKTION-05]
    module: [grundriss_solver, regelmaschine, kosten, varianten]
    rueckfrage: Soll {raum} wirklich entfallen? Die Fläche ginge an {empfaenger}.
  - intent: raum_verschieben
    beschreibung: Raum an eine andere Stelle oder Fassade verlegen
    risikoklasse: R1
    beispielsaetze: [Das Arbeitszimmer soll nach Süden, Leg die Küche an die Gartenseite, Das Bad bitte an die Nordwand verlegen]
    slots:
    - {name: raum, typ: raumref, pflicht: true}
    - {name: himmelsrichtung, typ: himmelsrichtung, pflicht: false}
    - {name: ziel, typ: bauteilref|raumref, pflicht: false, hinweis: 'Fassade, Wand oder Nachbarraum'}
    fragen: []
    regeln: [M.Projekt.Raum-Mindestmasse, BY.BayBO.45.Fensterflaeche, R5-AUSSEN-03, R5-KLIMA-01, R5-RUHE-01, DE.DIN4109.Aussenlaerm]
    module: [grundriss_solver, regelmaschine, schall, tga_routing]
    rueckfrage: 'Wohin soll {raum}: an welche Himmelsrichtung oder neben welchen Raum?'
  - intent: raeume_tauschen
    beschreibung: Lage zweier Räume tauschen
    risikoklasse: R1
    beispielsaetze: [Tausch Schlafzimmer und Arbeitszimmer, Küche und Wohnzimmer sollen die Plätze wechseln, Die beiden Kinderzimmer bitte tauschen]
    slots:
    - {name: raum_a, typ: raumref, pflicht: true}
    - {name: raum_b, typ: raumref, pflicht: true}
    fragen: []
    regeln: [M.Projekt.Raum-Mindestmasse, BY.BayBO.45.Fensterflaeche, R5-RUHE-02, R5-AUSSEN-03, DE.DIN4109.Aussenlaerm]
    module: [grundriss_solver, regelmaschine, schall, kosten]
    rueckfrage: Welche zwei Räume sollen die Plätze tauschen?
  - intent: raum_nutzung_aendern
    beschreibung: Nutzung oder Bezeichnung eines Raums ändern
    risikoklasse: R1
    beispielsaetze: [Das Gästezimmer wird mein Büro, Mach aus dem Abstellraum ein WC, Nenn das Kinderzimmer 2 Spielzimmer]
    slots:
    - {name: raum, typ: raumref, pflicht: true}
    - name: nutzung
      typ: enum
      pflicht: true
      quelle: modell
      werte: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      frage: q.nutzung
    - {name: name, typ: text, pflicht: false, hinweis: 'nur Bezeichnung, ohne Regelwirkung'}
    fragen:
    - id: q.nutzung
      typ: choice
      text: Welche Nutzung soll der Raum künftig haben?
      optionen: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      schwelle: 0.7
    regeln: [M.Projekt.Raum-Mindestmasse, BY.BayBO.45.Fensterflaeche, DE.DIN4109.Aussenlaerm, R5-HOME-02]
    module: [regelmaschine, tga_routing, schall]
    rueckfrage: Welche Nutzung soll {raum} bekommen?
  - intent: raeume_zusammenlegen
    beschreibung: zwei benachbarte Räume zu einem Raum verbinden
    risikoklasse: R2
    beispielsaetze: [Küche und Essen sollen ein offener Raum werden, Leg die zwei Kinderzimmer zusammen, Mach Wohnzimmer und Arbeitszimmer zu einem Raum]
    slots:
    - {name: raum_a, typ: raumref, pflicht: true}
    - {name: raum_b, typ: raumref, pflicht: true}
    - name: nutzung
      typ: enum
      pflicht: false
      quelle: modell
      werte: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      frage: q.raeume_zusammenlegen.nutzung
    fragen:
    - id: q.raeume_zusammenlegen.nutzung
      typ: choice
      text: Welcher Wert passt für „nutzung“?
      optionen: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      schwelle: 0.7
    regeln: [M.Projekt.Raum-Mindestmasse, DE.EC5-NA.NA67.Durchbruch, R5-FUNKTION-03]
    module: [grundriss_solver, statik_vorbemessung, regelmaschine, kosten]
    rueckfrage: Welche beiden Räume sollen verbunden werden? Die Wand dazwischen ist {wandtyp}.
    regeln_geplant: ['Kap. 15.2: tragende Innenwand entfernen nur mit Unterzug und Freigabe Tragwerk']
  - intent: raum_teilen
    beschreibung: Raum durch eine neue Innenwand teilen
    risikoklasse: R1
    beispielsaetze: [Teil das große Kinderzimmer in zwei Zimmer, Vom Schlafzimmer soll eine Ankleide abgetrennt werden, Kannst du den Hobbyraum halbieren]
    slots:
    - {name: raum, typ: raumref, pflicht: true}
    - name: anteil
      typ: prozent|laenge
      pflicht: false
      einheit: '%|m'
      wertebereich:
        prozent: [10, 90]
        laenge: [0.9, 10.0]
    - name: nutzung_neu
      typ: enum
      pflicht: false
      quelle: modell
      werte: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      frage: q.raum_teilen.nutzung_neu
    fragen:
    - id: q.raum_teilen.nutzung_neu
      typ: choice
      text: Welcher Wert passt für „nutzung_neu“?
      optionen: [wohnen, essen, kueche, schlafen, kind, gast, arbeiten, bad, wc, hwr, technik, abstellraum, speisekammer, ankleide, flur, sauna, hobby, sonstiges]
      schwelle: 0.7
    regeln: [M.Projekt.Raum-Mindestmasse, BY.BayBO.45.Fensterflaeche, DE.DIN4109-1.Tab2-Trennbauteile]
    module: [grundriss_solver, regelmaschine, kosten]
    rueckfrage: 'Wie soll {raum} geteilt werden: in der Mitte oder mit einem bestimmten Maß?'
  - intent: innenwand_versetzen
    beschreibung: nichttragende Innenwand um einen Betrag verschieben
    risikoklasse: R1
    beispielsaetze: [Schieb die Wand zwischen Bad und Flur zwanzig Zentimeter Richtung Flur, Die Trennwand im Obergeschoss einen halben Meter nach Osten, Die Wand zum Hauswirtschaftsraum
        ein Stück nach links]
    slots:
    - {name: wand, typ: bauteilref, pflicht: true}
    - name: wert
      typ: laenge
      pflicht: false
      einheit: m
      wertebereich: [0.05, 5.0]
    - {name: himmelsrichtung, typ: himmelsrichtung, pflicht: false}
    - {name: richtung, typ: richtung_relativ, pflicht: false}
    - {name: staerke, typ: staerke, pflicht: false, hinweis: 'nur wenn kein Zahlwert erkannt; Stufe → Schrittweite aus Tabelle, immer mit Vorschau'}
    fragen:
    - id: s.staerke
      typ: score
      text: Wie stark soll die Änderung sein?
      stufen: [sehr wenig, etwas, deutlich, stark, sehr stark]
      schwelle: 0.6
    regeln: [M.Projekt.Raum-Mindestmasse, M.Firma.Staenderbohrung, DE.VDI6000.Bewegungsflaeche]
