# Intent-Katalog der Sprachschnittstelle (Kapitel 10).
# Baum: gruppen[].intents[]. Prüfung: siehe Kapitel 10.7 (Python-Validator).
katalog: {name: HRB-Intent-Katalog, version: 0.1.0, stand: '2026-09-27', kapitel: '10', schema_hinweis: 'Baum Gruppe → Intent. Jede choice-Frage hat höchstens 19 Optionen (Laya-Grenze
    etwa 20, Recherche 03). Das Intent-Modell beantwortet nur typisierte Fragen (choice, score, noul). Werte, Referenzen und Katalogartikel ermittelt deterministischer Code (Abschnitt
    10.3). Regel-IDs verweisen auf regelkatalog.yaml und empfehlungen.yaml.', status: U, status_hinweis: Schwellwerte sind Startwerte (Designentscheidung E10.5) und nach Kalibrierung
    am Entwicklungsset festzulegen.}
risikoklassen:
  R0: {bedeutung: 'Auskunft, Ansicht, Dialog; ändert das Modell nicht', p_min: 0.55, abstand_min: 0.15, bestaetigung: keine, undo: nicht nötig}
  R1: {bedeutung: reversible Modelländerung mit lokaler Wirkung, p_min: 0.7, abstand_min: 0.2, bestaetigung: keine; Interpretationsanzeige und Undo, undo: ein Schritt}
  R2: {bedeutung: 'Änderung mit Folgen für Profil, Gebäudeklasse, Kosten > Schwelle oder mehrere Gewerke', p_min: 0.8, abstand_min: 0.25, bestaetigung: 'Vorschau mit Folgen, Bestätigung
      per Sprache oder Klick', undo: ein Schritt}
  R3: {bedeutung: 'schwer umkehrbar oder rechtserheblich (Löschen, Senden, Abschließen)', p_min: 0.9, abstand_min: 0.3, bestaetigung: ausdrücklich auf dem Bildschirm; Sprache allein
      genügt nie, undo: Variante vorher automatisch}
globale_fragen:
- id: q.gruppe
  typ: choice
  text: Zu welchem Bereich gehört die Äußerung?
  optionen: [grundriss, geschosse_baukoerper, huelle, dach, fassade, bemusterung_interior, tga, licht, pv, aussenanlagen, moeblierung, gebaeudetyp_nutzung, steuerung, anzeigen_auswerten,
    freigabe_prozess, meta]
  schwelle: 0.7
- {id: n.korrektur, typ: noul, text: 'Korrigiert oder widerruft der Sprecher seine vorige Äußerung?', schwelle: 0.6, wirkung: vorigen Frame ersetzen statt neuen anlegen}
- {id: n.nur_frage, typ: noul, text: 'Will der Sprecher nur eine Auskunft, ohne etwas zu ändern?', schwelle: 0.65, wirkung: Gruppe anzeigen_auswerten bevorzugen; keine Modelländerung}
- {id: n.bezug_vorher, typ: noul, text: 'Bezieht sich die Äußerung auf das zuletzt genannte oder ausgewählte Objekt?', schwelle: 0.6, wirkung: Referenz aus Dialogkontext statt aus der
    Äußerung}
- {id: n.verneinung, typ: noul, text: 'Enthält die Äußerung eine Verneinung des Wunsches (nicht, kein, ohne)?', schwelle: 0.6, wirkung: Aktion invertieren oder Rückfrage}
slot_typen:
  laenge: {dim: laenge, einheit: m, quelle: parser, grammatik: Massausdruck (werteparser-grammatik.md)}
  flaeche: {dim: flaeche, einheit: m², quelle: parser}
  winkel: {dim: winkel, einheit: °, quelle: parser}
  prozent: {dim: anteil, einheit: '%', quelle: parser}
  leistung: {dim: leistung, einheit: kW|kWp, quelle: parser}
  energie: {dim: energie, einheit: kWh, quelle: parser}
  volumen: {dim: volumen, einheit: m³|l, quelle: parser}
  u_wert: {dim: waermedurchgang, einheit: W/(m²K), quelle: parser}
  temperatur_k: {dim: farbtemperatur, einheit: K, quelle: parser}
  anzahl: {dim: anzahl, einheit: '1', quelle: parser}
  format: {dim: format, einheit: cm×cm, quelle: parser, grammatik: Formatausdruck}
  datum: {quelle: parser}
  modus:
    werte: [absolut, relativ_plus, relativ_minus]
    quelle: parser
    grammatik: Modusausdruck; Fallback n.relativ
  himmelsrichtung:
    werte: [N, 'NO', O, SO, S, SW, W, NW]
    quelle: parser
  richtung_relativ:
    werte: [links, rechts, vorne, hinten, oben, unten, mitte]
    quelle: parser
    hinweis: relativ zur aktuellen Ansicht; Rückfrage, wenn keine Ansicht aktiv
  staerke:
    werte: [1, 2, 3, 4, 5]
    quelle: modell (score)
    hinweis: Stufe → Schrittweite je Slot aus Konfiguration; immer mit Vorschau
  raumref: {ziel: IfcSpace, quelle: referenz, hinweis: Auflösung gegen State-JSON (Abschnitt 10.3.5)}
  geschossref: {ziel: IfcBuildingStorey, quelle: referenz}
  bauteilref: {ziel: IfcElement, quelle: referenz}
  moebelref: {ziel: IfcFurniture, quelle: referenz}
  zonenref: {ziel: IfcZone, quelle: referenz}
  variantenref: {ziel: Variante (CDE), quelle: referenz}
  optionsref: {ziel: zuletzt angebotene Optionen, quelle: referenz}
  meldungsref: {ziel: Meldung im Dialogprotokoll, quelle: referenz}
  katalogref: {ziel: IfcTypeObject der Projektbibliothek, quelle: katalog, hinweis: deterministische unscharfe Suche; bei mehr als einem Treffer Rückfrage mit höchstens fünf Kandidaten}
  farbe: {ziel: 'Farbkatalog (RAL, NCS, Herstellerfarbe)', quelle: katalog}
  enum: {quelle: modell (choice), hinweis: Werteliste im Slot; höchstens 19}
  bool: {quelle: modell (noul)}
  text: {quelle: roh, hinweis: nur Bezeichnungen ohne Regelwirkung}
