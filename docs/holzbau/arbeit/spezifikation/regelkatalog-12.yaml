- id: M.Bemusterung.Festschreibung
  version: 0.1.0
  titel: Festschreibung einer Auswahl durch Inhaltshash
  klasse: R4
  haerte: hart
  quelle: {art: M, werk: "spezifikation/bemusterung-katalog.schema.json", fundstelle: "#/$defs/auswahl", fassung: "0.1.0", status: U, recherche: ["13"]}
  profil: {name: M-Bemusterung-Prozess, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: vertragsschluss}
  eingaben:
    - {name: auswahl_json, einheit: "-", quelle: Festschreibung}
  pruefung:
    typ: attribut
    formel: "inhaltshash = 'sha256:' + SHA-256(UTF-8(kanonisch(auswahl ohne inhaltshash und lieferdaten))); kanonisch = Schlüssel sortiert, ohne Leerraum (JCS, RFC 8785, für die verwendeten Werte); IFC HRB_Auswahl.Inhaltshash gleich; Änderung ⇒ neue auswahl_id mit vorgaenger"
  grenzwerte: []
  meldung: "Auswahl {id}: Hash {ist} ≠ {soll}; Inhalt nach Festschreibung verändert."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "Nachtrag als neue Auswahl mit Verweis auf den Vorgänger"}
  status: U
  beispiel: [B16]
  kapitel: "12.4"
  anforderungen: [ANF-12-30]

