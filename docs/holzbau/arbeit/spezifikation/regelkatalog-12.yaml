    - {name: barrierefrei, einheit: "-", quelle: Profilschalter}
  pruefung:
    typ: attribut
    formel: "Duschfläche: Empfehlung Barfußklasse ≥ B; Schalter barrierefrei ⇒ B im Duschplatz verbindlich (Ergebnis verletzt statt Hinweis)"
  grenzwerte: []
  meldung: "Duschfläche {raum}: Barfußklasse {ist}; empfohlen bzw. verlangt ist B."
  alternative:
    - {art: A3_variante, beschreibung: "Oberfläche 'strukturiert' derselben Serie"}
  status: V
  beispiel: [keins]
  kapitel: "12.2.1"
  anforderungen: [ANF-12-06]

- id: M.Hersteller.Naturstein-Holzdecke
  version: 0.1.0
