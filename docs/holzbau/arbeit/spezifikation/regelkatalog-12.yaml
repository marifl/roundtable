# Regelkatalog Kapitel 12: Bemusterung, Innenausbau und Interior-Katalog.
# Schema: regel.schema.json (#/$defs/regel). Ergebniswerte: erfuellt | verletzt | unbestimmt | nicht_anwendbar | freigabepflichtig.
# Normwerte sind Einzelkennwerte mit Fundstelle, keine Tabellenkopien (Kapitel 9.7). Status U: vor Produktivbetrieb bestätigen.
# Neue Profile, in regelprofile.yaml zu registrieren: DE-aRdT-Ausbau (S3), M-Hersteller-Bemusterung (S5), M-Bemusterung-Prozess (S5).
# Verwendet von: bemusterung-abhaengigkeiten.yaml (Folgen je Option), Beispielauswahlen in beispiele/.

katalog:
  name: HRB-Regelkatalog Kapitel 12 (Bemusterung und Innenausbau)
  version: 0.1.0
  stand: "2026-09-27"
  kapitel: ["12"]
  hinweis: "Kennwerte aus Recherchen 10, 13, 16, 17 und den Beispielen B5, B14, B15, B16. Bestehende Regeln (DE.VDI6000.Bewegungsflaeche, DE.DIN18040-2.Bewegungsflaeche, DE.DIN18065.WG2WE, DE.Fussboden.OKFF-gleich, DE.EC5-NA.NA67.Durchbruch, M.Firma.Staenderbohrung) stehen in regelkatalog.yaml."

regeln:

# ---------------------------------------------------------------------------
# Sanitär und Vorwand
# ---------------------------------------------------------------------------
- id: M.Hersteller.WC-Montageelement
  version: 0.1.0
  titel: Wand-WC in der Holzständerwand – Tragkonstruktion des Montageelements
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Montagerichtlinie eines Vorwandsystem-Herstellers (Baustelleneinweisung 06/2018, DIN 4103-4)", fundstelle: "Holzständerwand", fassung: "06/2018", status: V, recherche: ["10"]}
  profil: {name: M-Hersteller-Bemusterung, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "IfcSanitaryTerminal TOILETPAN mit PanMounting = WALLHUNG vor einer Holzständerwand"
    r2_voraussetzung: [IDS.RG-sanitaer-R]
  eingaben:
    - {name: staender_querschnitt, einheit: mm, quelle: Wandelement}
    - {name: beplankung_dicke_je_seite, einheit: mm, quelle: Wandelement}
    - {name: lichter_staenderabstand, einheit: mm, quelle: Wandelement}
    - {name: befestigungspunkte, einheit: "-", quelle: Katalogartikel}
  pruefung:
    typ: geometrie
    funktion: wc_montageelement@0.1
    formel: "Ständer ≥ 60 × 80 mm an beiden Seiten des Elements ∧ Beplankung beidseitig ≥ 18 mm ∧ lichter Ständerabstand = 500 mm (sonst Querriegel einplanen) ∧ 4 Befestigungspunkte im Holz"
    parameter: {staender_mm: [60, 80], beplankung_min_mm: 18, lichter_abstand_mm: 500, befestigungspunkte: 4}
  grenzwerte:
    - {name: beplankung_min, wert: 18, einheit: mm, richtung: min, fundstelle: "Herstellerrichtlinie", status: V}
    - {name: lichter_abstand, wert: 500, einheit: mm, richtung: gleich, fundstelle: "Herstellerrichtlinie", status: V}
    - {name: prueflast_wand_wc, wert: 400, einheit: kg, richtung: min, fundstelle: "DIN EN 997 (nicht eingesehen)", status: U}
  meldung: "Wand-WC {wc}: Montageelement verlangt {forderung}; vorhanden {ist} in Wand {wand}."
  alternative:
    - {art: A2_kompensation, beschreibung: "zusätzliche Ständer bzw. Querriegel im Wandelement einplanen (Werkplanung)", frei: [wandelement.staenderlage]}
    - {art: A3_variante, beschreibung: "Vorwandelement vor der Wand statt Einbau in die Ständerwand"}
  status: V
  beispiel: [B15]
  kapitel: "12.2.7"
  anforderungen: [ANF-12-04]
  hinweis: "Werte aus Recherche 10 [V]; Prüflast 400 kg [U]. Firmenwerte über DAT-12-02 bestätigen."

- id: M.Hersteller.DuschWC-Strom
  version: 0.1.0
  titel: Dusch-WC braucht Stromanschluss und Leerrohr am Montageelement
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Produktübersicht eines Vorwandsystem-Herstellers", fundstelle: "Dusch-WC", fassung: "2025", status: V, recherche: ["10"]}
  profil: {name: M-Hersteller-Bemusterung, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung: {auswahl: "Katalogartikel mit Merkmal dusch_wc = true"}
  eingaben:
    - {name: dusch_wc, einheit: "-", quelle: Katalogartikel}
    - {name: steckdose_im_vorwandelement, einheit: "-", quelle: Elektroplan}
  pruefung:
    typ: aufzaehlung
    formel: "dusch_wc ⇒ ∃ IfcOutlet POWEROUTLET im Vorwandelement ∧ Leerrohr zum Verteiler; Freeze W (Dosenbohrung in der Wandfertigung)"
  grenzwerte: []
  meldung: "Dusch-WC {wc}: Steckdose im Vorwandelement fehlt; Anschluss muss vor der Wandfertigung festliegen."
  alternative:
    - {art: A2_kompensation, beschreibung: "Steckdose und Leerrohr automatisch ergänzen"}
  status: V
  beispiel: [keins]
  kapitel: "12.2.7"
  anforderungen: [ANF-12-05]

- id: DE.EC1-NA.Nutzlast-Badewanne
  version: 0.1.0
  titel: Gefüllte Badewanne auf Holzbalkendecke – örtliche Last über der Wohn-Nutzlast
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN EN 1991-1-1/NA; eigene Rechnung", fundstelle: "Nutzlastkategorie A2", fassung: "NA 2010-12", status: U, recherche: ["10"]}
  profil: {name: M-Hersteller-Bemusterung, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: einleitung_verfahren}
  vorbedingung: {auswahl: "IfcSanitaryTerminal BATH auf IfcSlab FLOOR aus Holz"}
  eingaben:
    - {name: wasser_l, einheit: l, quelle: Katalogartikel}
    - {name: masse_wanne_kg, einheit: kg, quelle: Katalogartikel}
    - {name: grundflaeche_m2, einheit: "m²", quelle: Katalogartikel}
  pruefung:
    typ: rechnung
    formel: "q = (Wasser + Wanne + Person 80 kg) · g / Grundfläche; q > 1,5 kN/m² ⇒ freigabepflichtig (Tragwerksplanung)"
    parameter: {person_kg: 80, nutzlast_A2_kN_m2: 1.5}
  grenzwerte:
    - {name: nutzlast_A2, wert: 1.5, einheit: "kN/m²", richtung: max, fundstelle: "EN 1991-1-1/NA, Kategorie A2", status: U}
  meldung: "Wanne {wanne}: örtliche Last {q} kN/m² > 1,5 kN/m²; Tragwerksplanung prüft Balkenlage."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "Nachweis durch die Tragwerksplanung (Balkenabstand, Querverteilung)"}
    - {art: A3_variante, beschreibung: "Wanne mit kleinerem Volumen oder Duschplatz"}
  freigabe_rolle: Tragwerksplanung
  status: U
  beispiel: [keins]
  kapitel: "12.2.7"
  anforderungen: [ANF-12-22]
  hinweis: "Beispielrechnung Recherche 10: 180 l + 30 kg + 80 kg ≈ 2,9 kN auf 1,28 m² ≈ 2,3 kN/m² [U]."

- id: M.Hersteller.Rinne-Einbauhoehe
  version: 0.1.0
  titel: Estrichhöhe am Einlauf der Duschrinne im zulässigen Bereich des Rohbausets
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Herstellerkataloge Duschrinnen (Rohbauset DN 40/DN 50)", fundstelle: "Einbauhöhen", fassung: "2025/2026", status: V, recherche: ["16"]}
  profil: {name: M-Hersteller-Bemusterung, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  eingaben:
    - {name: estrichhoehe_einlauf, einheit: mm, quelle: "B14"}
    - {name: rohbauset, einheit: "-", quelle: Katalogartikel}
  pruefung:
    typ: rechnung
    funktion: b14.rinne@1.0
    formel: "h_min(set) ≤ Estrichhöhe am Einlauf ≤ h_max(set)"
    parameter: {DN40_mm: [65, 90], DN50_mm: [90, 220]}
  grenzwerte:
    - {name: DN50_bereich, wert: [90, 220], einheit: mm, richtung: intervall, fundstelle: "Herstellerkatalog", status: V}
  meldung: "Rinne {rinne}: Estrichhöhe am Einlauf {h} mm außerhalb {h_min}–{h_max} mm."
  alternative:
    - {art: A3_variante, beschreibung: "anderes Rohbauset (flach/Norm) wählen"}
    - {art: A2_kompensation, beschreibung: "Rohdecke absenken (B14) bzw. Ablauf in die Balkenlage (B15)"}
  status: V
  beispiel: [B14]
  kapitel: "12.2.3"
  anforderungen: [ANF-12-23]
  tests: [tests/test_b14.py]

# ---------------------------------------------------------------------------
# Fliese, Abdichtung, Belag
# ---------------------------------------------------------------------------
- id: DE.DIN18534.W-Klasse
  version: 0.1.0
  titel: Wassereinwirkungsklasse je Fläche ableiten und Untergrund prüfen
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 18534-1 bis -6", fundstelle: "Wassereinwirkungsklassen W0-I bis W3-I; Untergründe", fassung: "2025-10", status: V, recherche: ["13", "16"]}
  profil: {name: DE-aRdT-Ausbau, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: "2025-10-01", bis: null, stichtag: abnahme}
  vorbedingung: {auswahl: "IfcCovering in IfcSpace mit Dusche, Wanne oder Bodenablauf"}
  eingaben:
    - {name: flaechenart, einheit: "-", quelle: Modell, beschreibung: "Wand an Dusche/Wanne, Wand sonst, Boden mit/ohne Ablauf"}
    - {name: duschabtrennung, einheit: "-", quelle: Bemusterung}
    - {name: bodengleich, einheit: "-", quelle: Bemusterung}
    - {name: untergrund, einheit: "-", quelle: Wandelement bzw. Fußbodenaufbau}
  pruefung:
    typ: aufzaehlung
    formel: "Boden bodengleiche Dusche = W2-I; ohne wirksame Abtrennung ganzer Badboden W2-I; Wand an Dusche/Wanne, Boden mit Ablauf = W1-I; sonst W0-I. Ab W2-I nur feuchteunempfindlicher Untergrund; Spezialgipsplatte in W2-I nur mit Herstellernachweis (sonst freigabepflichtig); Holz/Holzwerkstoff nie direkt unter AIV; am Boden keine Dispersionsabdichtung"
  grenzwerte: []
  meldung: "{flaeche}: Wassereinwirkungsklasse {w}; Untergrund {u} ist dafür {bewertung}."
  alternative:
    - {art: A3_variante, beschreibung: "zementgebundene Platte oder Estrich in der Gefällefläche"}
    - {art: A5_freigabeweg, beschreibung: "Systemnachweis des Plattenherstellers hinterlegen"}
  status: V
  beispiel: [B14]
  kapitel: "12.2.1"
  anforderungen: [ANF-12-07]

- id: DE.DIN18534.Kapillarsperre-Tuer
  version: 0.1.0
  titel: Kapillaren Feuchtetransport an Badtüren unterbrechen (Parkett neben Bad)
  klasse: R1
  haerte: weich
  quelle: {art: N, werk: "DIN 18534-1", fundstelle: "8.5.5", fassung: "2025-10", status: V, recherche: ["13"]}
  profil: {name: DE-aRdT-Ausbau, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: "2025-10-01", bis: null, stichtag: abnahme}
  eingaben:
    - {name: belag_links, einheit: "-", quelle: Bemusterung}
    - {name: belag_rechts, einheit: "-", quelle: Bemusterung}
    - {name: w_klasse_bad, einheit: "-", quelle: DE.DIN18534.W-Klasse}
  pruefung:
    typ: topologie
    formel: "Übergang (IfcDoor) zwischen Raum mit W ≥ W1-I und feuchteempfindlichem Belag ⇒ Kapillarsperre im Belagaufbau und Abdichtung in die Türleibung"
  grenzwerte: []
  meldung: "Tür {tuer}: Kapillarsperre zwischen {bad} und {nachbar} einplanen."
  alternative:
    - {art: A2_kompensation, beschreibung: "Trennschiene mit Kapillarsperre und Abdichtung bis in die Leibung"}
  status: V
  beispiel: [B14]
  kapitel: "12.2.3"
  anforderungen: [ANF-12-14]

- id: DE.ZDB.Grossformat
  version: 0.1.0
  titel: Großformatige Fliesen – Mindestfuge, Mindestdicke, Sonderkonstruktion
  klasse: R1
  haerte: weich
  quelle: {art: H, werk: "ZDB-Merkblatt Großformate (Neuausgabe 'Groß- und Megaformate' 2026-02 nicht eingesehen)", fundstelle: "Anwendungsbereich, Fugenbreite", fassung: "vor 2026-02", status: U, recherche: ["13", "17"]}
  profil: {name: DE-aRdT-Ausbau, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung: {anwendbar_wenn: "Fliesenfläche > 0,25 m² je Stück"}
  eingaben:
    - {name: format_mm, einheit: mm, quelle: Katalogartikel}
    - {name: fugenbreite_mm, einheit: mm, quelle: Auswahl}
    - {name: dicke_mm, einheit: mm, quelle: Katalogartikel}
  pruefung:
    typ: attribut
    formel: "Fuge ≥ 3 mm; Dicke Boden ≥ 7,5 mm, Wand ≥ 3,5 mm; Kante > 1200 mm (Riegel > 1500 mm) ⇒ Sonderkonstruktion (freigabepflichtig, schriftlich vereinbaren)"
    parameter: {grossformat_ab_m2: 0.25, fuge_min_mm: 3, dicke_boden_min_mm: 7.5, dicke_wand_min_mm: 3.5, sonder_ab_mm: 1200}
  grenzwerte:
    - {name: fuge_min, wert: 3, einheit: mm, richtung: min, fundstelle: "ZDB, Mindestfuge Großformat", status: V}
    - {name: grossformat_ab, wert: 0.25, einheit: "m²", richtung: gleich, fundstelle: "ZDB-Merkblatt", status: V}
  meldung: "Großformat {format}: {verstoss}."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Fuge auf 3 mm setzen"}
    - {art: A3_variante, beschreibung: "kleineres Format derselben Serie"}
  status: U
  beispiel: [keins]
  kapitel: "12.2.1"
  anforderungen: [ANF-12-10]

- id: M.Hersteller.Fliese-Versatz
  version: 0.1.0
  titel: Versatz im Verband bei Rechteckformaten höchstens ein Drittel
  klasse: R1
  haerte: weich
  quelle: {art: M, werk: "Herstellerdatenblätter, Innungshinweis", fundstelle: "Verlegeempfehlung Rechteckformate", fassung: "2026", status: V, recherche: ["13"]}
  profil: {name: M-Hersteller-Bemusterung, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  eingaben:
    - {name: versatz, einheit: "-", quelle: HRB_Verlegung.Versatz}
    - {name: seitenverhaeltnis, einheit: "-", quelle: Katalogartikel}
  pruefung:
    typ: attribut
    formel: "Rechteckformat (L/B ≥ 2) ∧ Muster = gerade ⇒ Versatz ≤ 1/3; Halbverband (1/2) nur mit Hinweis 'Überzähne'"
    parameter: {versatz_max: 0.3333}
  grenzwerte:
    - {name: versatz_max, wert: 0.3333, einheit: "-", richtung: max, fundstelle: "Herstellerempfehlung", status: V}
  meldung: "Versatz {versatz} > 1/3 bei {format}: Hoch- und Tiefpunkte treffen sich (Überzähne)."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Drittel- oder Viertelverband"}
  status: V
  beispiel: [B16]
  kapitel: "12.2.1"
  anforderungen: [ANF-12-10]

- id: DE.ATV18352.Fugenbreite
  version: 0.1.0
  titel: Technisch notwendige Fugenbreite und Regelverfugung (VOB/C)
  klasse: R1
  haerte: weich
  quelle: {art: N, werk: "ATV DIN 18352", fundstelle: "3.4.2, 3.4.3", fassung: "2019-09", status: V, recherche: ["13"]}
  profil: {name: DE-aRdT-Ausbau, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: "2019-09-01", bis: null, stichtag: vertragsschluss}
  eingaben:
    - {name: fugenbreite_mm, einheit: mm, quelle: Auswahl}
    - {name: fugenfarbe, einheit: "-", quelle: Auswahl}
  pruefung:
    typ: attribut
    formel: "2 mm ≤ Fuge ≤ 8 mm (je nach Format und Toleranz mehr); Fugenfarbe ≠ grau oder Reaktionsharz ⇒ Leistung ausdrücklich im LV beschreiben"
  grenzwerte:
    - {name: fuge, wert: [2, 8], einheit: mm, richtung: intervall, fundstelle: "ATV DIN 18352 3.4.2", status: V}
  meldung: "Fuge {f} mm außerhalb 2–8 mm bzw. Sonderfarbe {farbe} nicht im LV."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Fugenbreite in mm-Schritten im Bereich wählen"}
  status: V
  beispiel: [B16]
  kapitel: "12.2.1"
  anforderungen: [ANF-12-06]

- id: DE.DIN18202.Ebenheit-Belag
  version: 0.1.0
  titel: Erhöhte Ebenheit (Tab. 3 Zeile 4) für Großformat und Beton Ciré vereinbaren
  klasse: R1
  haerte: hinweis
  quelle: {art: N, werk: "DIN 18202", fundstelle: "Tab. 3 Zeilen 3 und 4", fassung: "2019-07", status: V, recherche: ["13", "16"]}
  profil: {name: DE-aRdT-Ausbau, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: "2019-07-01", bis: null, stichtag: vertragsschluss}
  eingaben:
    - {name: belag, einheit: "-", quelle: Bemusterung}
  pruefung:
    typ: attribut
    formel: "Großformat (> 0,25 m²) oder Beton Ciré oder Klebevinyl ⇒ Zeile 4 vereinbaren (Stichmaß 1 mm bei 0,1 m, 3 mm bei 1 m) und als Mehrpreis ausweisen"
  grenzwerte:
    - {name: stichmass_z4_1m, wert: 3, einheit: mm, richtung: max, fundstelle: "DIN 18202 Tab. 3 Z. 4", status: V}
  meldung: "{belag}: erhöhte Ebenheit (Zeile 4) als Besondere Leistung vereinbaren."
  alternative: []
  status: V
  beispiel: [keins]
  kapitel: "12.2.1"
  anforderungen: [ANF-12-10]

- id: M.Firma.Mindestschnitt
  version: 0.1.0
  titel: Mindestgröße von Schnittstücken (Firmenregel statt Drittelregel)
  klasse: R1
  haerte: weich
  quelle: {art: M, werk: "Firmenregel (Platzhalter aus B16)", fundstelle: "B16 regeln.min_breite_mm", fassung: "Platzhalter 2026-09", status: U, recherche: ["17"]}
  profil: {name: M-Firma, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  eingaben:
    - {name: inkreis_mm, einheit: mm, quelle: "B16 Stückliste"}
  pruefung:
    typ: geometrie
    funktion: b16.kleinstueck@1.0
    formel: "Inkreisdurchmesser jedes Stücks ≥ 20 mm; < 6 mm wird verfugt; Flächenanteil ≥ 1/3 nur bei geradem Muster ohne Knicklinien prüfen"
