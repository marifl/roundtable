  alternative:
    - {art: A3_variante, beschreibung: "Rasterursprung aus der Grid-Search mit weniger Kleinstücken wählen"}
  status: U
  beispiel: [B16]
  kapitel: "12.2.2"
  anforderungen: [ANF-12-11]

- id: DE.DINEN16165.Rutschhemmung
  version: 0.1.0
  titel: Rutschhemmung von Bodenbelägen (Empfehlung im EFH, Pflicht bei Barrierefreiheit)
  klasse: R1
  haerte: hinweis
  quelle: {art: N, werk: "DIN EN 16165 (Prüfung); DGUV I 207-006; DIN 18040-2 (Bewertungsgruppe B)", fundstelle: "Anhang B; Duschplätze", fassung: "2023", status: V, recherche: ["13", "17"]}
  profil: {name: DE-aRdT-Ausbau, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: "2023-01-01", bis: null, stichtag: pruefzeitpunkt}
  eingaben:
    - {name: r_klasse, einheit: "-", quelle: HRB_Belag.Rutschhemmung}
