      aufbau:
        - {text: "schwimmend auf FBH nur bedingt geeignet (Luftschicht) – Konflikt mit Standard 'schwimmend' der Bau- und Leistungsbeschreibung; vollflächig kleben", regel: DE.BVF.FBH-Belagwiderstand, status: V}
        - {text: "B14 Variante A, Wohnen: CAF-F4 67 mm, OKFF 210 mm ± 0,6 mm", regel: DE.Fussboden.OKFF-gleich, beispiel: B14, status: V}
      kosten:
        - {text: "Budget 80 €/m² UVP; Testfall: UVP 95 €/m², 20 m², Verschnitt 5 % → 315,00 € Mehrpreis", regel: M.Bemusterung.Mehrpreis, status: U}
    regeln: [DE.BVF.FBH-Belagwiderstand, DE.Fussboden.OKFF-gleich, M.Bemusterung.Mehrpreis]
    quellen: {bib: [regnauerBLB2024], recherche: ["10", "13", "16"], beispiele: [B14]}

