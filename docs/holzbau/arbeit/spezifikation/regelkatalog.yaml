- id: DE.DIN4109.Aussenlaerm
  version: 0.1.0
  titel: Schallschutz gegen Außenlärm
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 4109-1, DIN 4109-2; BayTB", fundstelle: "4109-1 7.1 Gl. 6; 4109-2 4.4.5, Gl. 32/33; BayTB A 5.2/1 Nr. 5", fassung: "2018-01; BayTB 2025-11", status: V, bib: [baytb2025], recherche: ["20"]}
