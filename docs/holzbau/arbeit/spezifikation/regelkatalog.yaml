    - {name: rand_zu_h, wert: 0.35, einheit: "-", richtung: min, fundstelle: "NA NCI NA.6.7", status: V}
  meldung: "{leitung}: h_d = {hd} mm > 0,15 · h = {grenze} mm; unverstärkt unzulässig."
  alternative:
    - {art: A3_variante, beschreibung: "Leitung parallel zur Balkenlage führen"}
    - {art: A2_kompensation, beschreibung: "Wechsel oder Verstärkung mit Nachweis"}
