  status: V
  beispiel: [B15]
  kapitel: "9.4.7"
  anforderungen: [ANF-09-07]
  tests: [tests/test_b15.py::test_querbohrungen_na_6_7, tests/test_b15.py::test_rasterkollision_fuehrt_zu_wechsel]

