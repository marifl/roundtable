# Regelkatalog (initial), abgeleitet aus Kapitel 9 und 9a.
# Schema: regel.schema.json (#/$defs/regel). Ergebniswerte: erfuellt | verletzt | unbestimmt |
# nicht_anwendbar | freigabepflichtig (Kapitel 9.2.1).
# Normwerte sind Einzelkennwerte mit Fundstelle, keine Tabellenkopien (Kapitel 9.7).
# Status U: vor dem Produktivbetrieb an der Primärquelle bzw. beim Hersteller zu bestätigen.

katalog:
  name: HRB-Regelkatalog
  version: 0.1.0
  stand: "2026-09-27"
  kapitel: ["9", "9a"]
  hinweis: "Initialer Katalog. Kennwerte aus Recherchen 02, 08, 09, 13, 14, 16, 20, 22 und Beispielen B2-B20."

regeln:

# ---------------------------------------------------------------------------
# Kapitel 9.4: R1-Regeln aus Gesetz, Norm, Handwerk, Hersteller
# ---------------------------------------------------------------------------

- id: BY.BayBO.6.T
  version: 0.1.0
  titel: Abstandsfläche vor Außenwänden
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: BayBO, fundstelle: "Art. 6 Abs. 4 und 5", fassung: "ab 2026-05-01", status: U, bib: [baybo2026], recherche: ["02"]}
  profil: {name: BY-BayBO-2026-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Bayern; außerhalb GE/GI; Gemeinde <= 250 000 Einwohner (sonst Abs. 5a)"
    gebaeudetypen: [alle]
    zeit: {von: "2026-05-01", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcWall mit Pset_WallCommon.IsExternal = TRUE"
    ausnahmen: [satzung_art81, dachueberstand_abs6, grenzgarage_abs7, waermepumpe_bis_2m_abs1_s3_nr4, grenzbebauung_planungsrechtlich_abs1_s4]
    r2_voraussetzung: [BY-R2-Gelaende-DGM, BY-R2-Grundstuecksgrenze]
  eingaben:
    - {name: wandhoehe, einheit: m, quelle: Modell, beschreibung: "Gelände bis Schnittpunkt Wand/Dachhaut"}
    - {name: dachhoehe, einheit: m, quelle: Modell}
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: grundstueck, einheit: "m (Polygon)", quelle: Kontext}
  pruefung:
    typ: geometrie
    funktion: abstandsflaeche@1.2
    formel: "H = wandhoehe + a*dachhoehe, a = 1/3 wenn dachneigung <= 70°, sonst 1; T = max(0,4*H; 3,00 m); verletzt wenn Fläche(AF \\ (Grundstück ∪ halbe Verkehrsfläche)) > 0"
    parameter: {faktor: 0.4, mindesttiefe_m: 3.0, grenzneigung_grad: 70, dachanteil: 0.3333}
    auslegung: {giebel_modus: "drittel [U]; Alternative: voll"}
  grenzwerte:
    - {name: faktor, wert: 0.4, einheit: "-", richtung: gleich, fundstelle: "Art. 6 Abs. 5", status: V}
    - {name: mindesttiefe, wert: 3.0, einheit: m, richtung: min, fundstelle: "Art. 6 Abs. 5", status: V}
  meldung: "Die Abstandsfläche der {wand} ist {T:.2f} m tief (0,4 · {H:.2f} m). {A:.2f} m² liegen außerhalb des Grundstücks."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Haus verschieben, bis keine Fläche außerhalb liegt", frei: [haus.x, haus.y]}
    - {art: A2_kompensation, beschreibung: "H verkleinern über Dachneigung oder Wandhöhe", frei: [dach.neigung, wand.hoehe]}
    - {art: A5_freigabeweg, beschreibung: "Abweichung nach Art. 63 BayBO (Behörde)"}
  status: U
  beispiel: [B4]
  kapitel: "9.4.1"
  anforderungen: [ANF-09-02, ANF-09-21, ANF-09-22]
  tests: [tests/test_b4_b5.py::test_mass_h_und_tiefe, tests/test_b4_b5.py::test_szenarien, tests/test_b4_b5.py::test_giebelprofil_gestaucht]

- id: BY.BayBO.2-5.aF2007.Vollgeschoss
  version: 0.1.0
  titel: Vollgeschoss (fortgeltende Fassung bis 31.12.2007)
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: BayBO, fundstelle: "Art. 83 Abs. 6 i. V. m. Art. 2 Abs. 5 a. F.", fassung: "bis 2007-12-31", status: V, bib: [baybo2026, baunvo], recherche: ["02"]}
  profil: {name: BY-BayBO-2026-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: Bayern
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: datum_bebauungsplan}
  vorbedingung:
    auswahl: "jedes IfcBuildingStorey"
    anwendbar_wenn: "Bebauungsplan setzt Zahl der Vollgeschosse Z fest"
    r2_voraussetzung: [BY-R2-Gelaende-DGM, BY-R2-BPlan-Z, BY-R2-BPlan-Datum]
  eingaben:
    - {name: grundflaeche_geschoss, einheit: "m²", quelle: Modell}
    - {name: flaeche_lichte_hoehe_ge_2_30, einheit: "m²", quelle: Modell}
    - {name: uk_decke_ueber_gelaende_mittel, einheit: m, quelle: "Modell + DGM"}
    - {name: Z, einheit: "-", quelle: Bebauungsplan}
  pruefung:
    typ: geometrie
    funktion: vollgeschoss@0.1
    formel: "VOLL(g) = vollständig über Gelände ∧ A(h >= 2,30 m) >= 2/3·A(g); Keller zählt, wenn mittel(UK Decke − Gelände) >= 1,20 m; verletzt wenn Anzahl VOLL > Z. Vorab: k* = kleinster Kniestock mit A(h>=2,30) = 2/3·A (Bisektion)"
    parameter: {lichte_hoehe_min_m: 2.30, flaechenanteil: 0.6667, keller_uk_min_m: 1.20}
  grenzwerte:
    - {name: lichte_hoehe, wert: 2.30, einheit: m, richtung: min, fundstelle: "Art. 2 Abs. 5 a. F.", status: V}
    - {name: flaechenanteil, wert: 0.6667, einheit: "-", richtung: min, fundstelle: "Art. 2 Abs. 5 a. F.", status: V}
    - {name: keller_uk_ueber_gelaende, wert: 1.20, einheit: m, richtung: min, fundstelle: "Art. 2 Abs. 5 a. F.", status: V}
  meldung: "Das {geschoss} ist ein Vollgeschoss ({anteil:.0%} der Fläche mit mindestens 2,30 m). Der Bebauungsplan erlaubt {Z} Vollgeschosse."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Kniestock unter k* halten", frei: [dach.kniestock]}
    - {art: A3_variante, beschreibung: "Dachneigung oder Gaubenbreite ändern", frei: [dach.neigung, gaube.breite]}
  status: V
  beispiel: [keins]
  kapitel: "9.4.2"
  anforderungen: [ANF-09-08, ANF-09-19]

- id: DE.DIN18065.WG2WE
  version: 0.1.0
  titel: Treppenhauptmaße in Wohngebäuden mit höchstens zwei Wohnungen
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 18065", fundstelle: "Hauptmaße Wohngebäude <= 2 WE", fassung: "2020-08", status: V, bib: [din18065], recherche: ["02", "13"]}
  profil: {name: DE-DIN18065-WG2WE, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [EFH, EFH_ELW, ZFH, DHH, RH_Ende, RH_Mitte, Bungalow, TinyHouse]
    zeit: {von: "2020-08-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcStair mit IfcStairFlight"
    anwendbar_wenn: "n_WE <= 2; innerhalb von Wohnungen bzw. GK 1/2 nicht bauaufsichtlich eingeführt (aRdT)"
  eingaben:
    - {name: geschosshoehe, einheit: mm, quelle: "Modell (OKFF bis OKFF)"}
    - {name: laufbreite, einheit: mm, quelle: Modell}
    - {name: lauflaenge_verfuegbar, einheit: mm, quelle: Modell}
  pruefung:
    typ: aufzaehlung
    funktion: treppe_solver@1.0
    formel: "n ∈ ℕ, s = H/n, a im 5-mm-Raster; zulässig ⇔ 140<=s<=200 ∧ 230<=a<=370 ∧ 590<=2s+a<=650 ∧ laufbreite>=800 ∧ (n−1)·a <= lauflaenge; Rang: |2s+a−630| (Toleranz 2,5) → |a−s−120| → |a+s−460| → Lauflänge"
    parameter: {raster_mm: 5, ziel_schrittmass_mm: 630, toleranz_mm: 2.5}
  grenzwerte:
    - {name: steigung, wert: [140, 200], einheit: mm, richtung: intervall, fundstelle: "DIN 18065", status: V}
    - {name: auftritt, wert: [230, 370], einheit: mm, richtung: intervall, fundstelle: "DIN 18065", status: V}
    - {name: schrittmass, wert: [590, 650], einheit: mm, richtung: intervall, fundstelle: "DIN 18065", status: V}
    - {name: laufbreite, wert: 800, einheit: mm, richtung: min, fundstelle: "DIN 18065", status: V}
  meldung: "Für {H} mm Geschosshöhe und {b} mm Laufbreite gibt es {anzahl} zulässige Treppen. Die Laufbreite muss mindestens 800 mm betragen."
  alternative:
    - {art: A1_grenzwert, beschreibung: "kleinste zulässige Laufbreite 800 mm", frei: [treppe.laufbreite]}
    - {art: A3_variante, beschreibung: "nächstbeste Lösung, z. B. bei begrenzter Lauflänge"}
  status: V
  beispiel: [B5]
  kapitel: "9.4.3"
  anforderungen: [ANF-09-17, ANF-09-23]
  tests: [tests/test_b4_b5.py::test_treppe_290, tests/test_b4_b5.py::test_treppe_randfaelle]

- id: BY.BayBO.45.Fensterflaeche
  version: 0.1.0
  titel: Fensterfläche von Aufenthaltsräumen
  klasse: R1
  haerte: hart
  quelle: {art: G, werk: BayBO, fundstelle: "Art. 45", fassung: "ab 2026-05-01", status: V, bib: [baybo2026], recherche: ["02"]}
  profil: {name: BY-BayBO-2026-05, version: 0.1.0}
  schicht: S1
  geltung:
    raum: Bayern
    gebaeudetypen: [alle]
    zeit: {von: "2026-05-01", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcSpace mit Nutzung Aufenthaltsraum"
  eingaben:
    - {name: netto_grundflaeche, einheit: "m²", quelle: Modell}
    - {name: fensterflaeche, einheit: "m²", quelle: Modell}
  pruefung:
    typ: rechnung
    funktion: fensterflaeche@0.1
    formel: "Σ Fensterfläche(r) >= NGF(r)/8"
    parameter: {anteil: 0.125}
    auslegung: {fenstermass: "rohbaumass oder lichtes_mass [U]"}
  grenzwerte:
    - {name: anteil, wert: 0.125, einheit: "-", richtung: min, fundstelle: "Art. 45", status: V}
  meldung: "{raum}: Fensterfläche {ist:.2f} m² < {soll:.2f} m² (1/8 von {ngf:.1f} m²). Es fehlen {fehl:.2f} m²."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Fenster um die fehlende Fläche vergrößern", frei: [fenster.breite, fenster.hoehe]}
    - {art: A3_variante, beschreibung: "zweites Fenster oder Dachfenster"}
  status: V
  beispiel: [keins]
  kapitel: "9.4.4"
  anforderungen: [ANF-09-21, ANF-09-24]

- id: DE.ZVDH.DZ.Dachneigung
  version: 0.1.0
  titel: Regeldachneigung, Mindestdachneigung und Zusatzmaßnahmen
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "1.1, Tab. 3; Merkblatt Unterdächer", fassung: "2024-04", status: V, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcRoof mit IfcCovering ROOFING Dachziegel/Dachstein"
  eingaben:
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: deckung, einheit: "-", quelle: Bemusterung}
    - {name: sparrenlaenge, einheit: m, quelle: Modell}
    - {name: schneelast, einheit: "kN/m²", quelle: Kontext}
    - {name: windzone, einheit: "-", quelle: Kontext}
  pruefung:
    typ: rechnung
    funktion: zvdh_klasse@0.1
    formel: "verletzt wenn DN < 10°; wenn DN < RDN(deckung): Klasse = Schwelle(RDN, DN, erhöhte Anforderung); z. B. RDN 30°: DN>=18° K2/K1, >=22° K3/K2, >=26° K4/K3, >=30° K5/K4 (ohne/mit erhöhter Anforderung); erhöhte Anforderungen werden nicht aufaddiert"
    parameter: {mindestneigung_grad: 10, rdn_klassen_grad: [22, 25, 30, 35, 40], klassen: [1, 2, 3, 4, 5]}
  grenzwerte:
    - {name: mindestdachneigung, wert: 10, einheit: "°", richtung: min, fundstelle: "FR 04/2024, 1.1", status: V}
    - {name: schneelast_erhoeht, wert: 1.5, einheit: "kN/m²", richtung: gleich, fundstelle: "FR 04/2024 (über Herstellerbroschüren)", status: V}
  meldung: "Dachneigung {DN}° liegt unter der Regeldachneigung {RDN}° der Deckung {deckung}. Erforderlich ist eine Zusatzmaßnahme der Klasse K{K}."
  alternative:
    - {art: A3_variante, beschreibung: "Deckung mit kleinerer Regeldachneigung wählen", frei: [bemusterung.deckung]}
    - {art: A1_grenzwert, beschreibung: "Dachneigung für die nächstschwächere Klasse nennen", frei: [dach.neigung]}
  status: V
  beispiel: [keins]
  kapitel: "9.4.5"
  anforderungen: [ANF-09-20, ANF-09-25]
  hinweis: "Volltext kostenpflichtig; Werte je Fundstelle in eigener Regeltabelle, Lizenz ZVDH prüfen."

- id: DE.Fussboden.OKFF-gleich
  version: 0.1.0
  titel: Fußbodenaufbau mit gleicher Fertigfußbodenhöhe je Geschoss
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 18560-2; Systemregeln der Hersteller", fundstelle: "DIN 18560-2 Tab. 1, 4.2.2; IGG-Merkblatt 5", fassung: "2022-08", status: U, recherche: ["16"]}
  profil: {name: DE-Fussboden, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "alle IfcSpace eines Geschosses mit Belag"
    r2_voraussetzung: [HRB-R2-Belag, HRB-R2-Leitungen-im-Aufbau]
  eingaben:
    - {name: ziel_aufbauhoehe, einheit: mm, quelle: Projekt}
    - {name: rohdecke_absenkung, einheit: mm, quelle: Rohbau}
    - {name: belag, einheit: "-", quelle: Bemusterung}
    - {name: leitungen, einheit: mm, quelle: TGA}
  pruefung:
    typ: optimierung
    funktion: fussboden_solver@1.0
    formel: "je Raum: Aufzählung diskreter Kombinationen; stetige Schichten exakt (Füllen nach Stückkosten); hart: Estrich-Nenndicke + Rohrüberdeckung, Leitungen überdeckt, Zusammendrückbarkeit, U-Wert, Flächenmasse, Beschwerung, Toleranzkette <= ±2 mm, Trockenestrich nur mit Ausgleich; Ziel min w_m·Masse + w_k·Kosten + w_l·Lagen; sonst Diagnose [H_min, H_max] und Ausschlussgründe"
    parameter: {okff_toleranz_mm: 2.0}
  grenzwerte:
    - {name: rohrueberdeckung_CT_F4, wert: 45, einheit: mm, richtung: min, fundstelle: "DIN 18560-2:2022-08, 4.2.2", status: U}
    - {name: rohrueberdeckung_CAF_F4, wert: 40, einheit: mm, richtung: min, fundstelle: "DIN 18560-2 Fassung 2004; 2022 laut Sekundärquellen unverändert", status: U}
    - {name: nenndicke_min_CT_F4, wert: 45, einheit: mm, richtung: min, fundstelle: "DIN 18560-2:2022-08, Tab. 1", status: U}
    - {name: R_lambda_B_weich, wert: 0.15, einheit: "m²K/W", richtung: max, fundstelle: "weiche Regel FBH/Belag (B14)", status: U}
  meldung: "Kein zulässiger Aufbau für H = {H} mm. Mindestens erreichbar: {H_min} mm (fehlen {fehl} mm). Häufigste Ausschlussgründe: {gruende}."
  alternative:
    - {art: A2_kompensation, beschreibung: "Rohdecke im Raum um die fehlende Höhe absenken (Rohbauvorgabe)", frei: [rohbau.absenkung]}
    - {art: A1_grenzwert, beschreibung: "Ziel-Aufbauhöhe erhöhen", frei: [geschoss.aufbauhoehe]}
    - {art: A3_variante, beschreibung: "dünneres System oder Leitungsführung in der Balkenlage (B15)"}
  status: U
  beispiel: [B14]
  kapitel: "9.4.6"
  anforderungen: [ANF-09-17, ANF-09-26]
  tests: [tests/test_b14.py::test_gleiche_okff_und_schichtsumme, tests/test_b14.py::test_konflikt_bad_ohne_absenkung, tests/test_b14.py::test_konflikt_abwasser_im_trockenaufbau, tests/test_b14.py::test_teppich_auf_fbh_verstoss]

- id: DE.EC5-NA.NA67.Durchbruch
  version: 0.1.0
  titel: Durchbrüche und Querbohrungen in Holzbalken
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN EN 1995-1-1/NA", fundstelle: "NCI NA.6.7", fassung: "2010-12 + A2:2014, NA 2013-08", status: V, bib: [baytb2025], recherche: ["08", "16"]}
  profil: {name: DE-EC5-2010-A2, version: 0.1.0}
  schicht: S2
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: einleitung_verfahren}
  vorbedingung:
    auswahl: "IfcMember/IfcBeam mit IfcOpeningElement durch Leitung"
  eingaben:
    - {name: balkenhoehe_h, einheit: mm, quelle: Modell}
    - {name: oeffnung_d, einheit: mm, quelle: TGA}
    - {name: randabstand_oben_unten, einheit: mm, quelle: Modell}
    - {name: abstand_auflager_lA, einheit: mm, quelle: Modell}
    - {name: abstand_durchbrueche_lz, einheit: mm, quelle: Modell}
  pruefung:
    typ: geometrie
    funktion: durchbruch_na67@1.0
    formel: "d <= 50 mm: Querschnittsschwächung (Nettoquerschnitt); sonst Durchbruch: unverstärkt nur wenn h_d <= 0,15 h ∧ h_ro >= 0,35 h ∧ h_ru >= 0,35 h ∧ l_A >= h/2 ∧ l_z >= max(1,5 h; 300 mm); Hinweis Profil EC5-2026: Vollholz/KVH nur verstärkt"
    parameter: {grenze_durchbruch_mm: 50, hd_faktor: 0.15, rand_faktor: 0.35}
