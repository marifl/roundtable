    merkmale_typisch: {anbau: freistehend, n_WE: 1, geschosse: 1}
    gk_typisch: 1
    regelbereiche:
      brandschutz: "ebenerdig bis 400 m²: ein Rettungsweg genügt (Art. 31 Abs. 1 S. 2 Nr. 2)"
    kipppunkte: []
    status: V
