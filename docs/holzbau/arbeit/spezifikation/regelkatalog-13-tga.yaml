    formel: "n_min = 3 (<= 50 m²), 4 (<= 75), 5 (<= 100), 6 (<= 125), 7 (> 125); Doppelsteckdose zählt als 2; Stufe RAL-RG 678 kann erhöhen, nie senken"
    parameter: {tabelle: "tga-dimensionierung.yaml#stromkreise_DIN18015-2"}
  grenzwerte:
