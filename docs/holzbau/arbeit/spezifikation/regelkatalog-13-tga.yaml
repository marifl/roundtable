# Regelkatalog Kapitel 13: Technische Gebäudeausrüstung und Routing.
# Schema: regel.schema.json (#/$defs/regel). Ergebniswerte: erfuellt | verletzt | unbestimmt |
# nicht_anwendbar | freigabepflichtig (Kapitel 9.2.1). Normwerte als Einzelkennwerte mit
# Fundstelle (Kapitel 9.7); Formeln und Kennwerttabellen in tga-dimensionierung.yaml.
# Ergänzt regelkatalog.yaml. Dort bereits geführt und hier nur referenziert:
#   DE.EC5-NA.NA67.Durchbruch, M.Firma.Staenderbohrung, DE.TALaerm.WP-Richtwert,
#   M.Hersteller.R290-Schutzbereich, M.Firma.WP-Irrelevanzziel.
# Neue Profile (zur Registrierung in regelprofile.yaml vorgeschlagen, Kapitel 13.14.1):
#   DE-aRdT-TGA (S3), EU-FGas-2024 (S1), EU-GIA-2024 (S1), DE-TrinkwV (S1).
# Status U: vor dem Produktivbetrieb an der Primärquelle bzw. beim Hersteller zu bestätigen.

katalog:
  name: HRB-Regelkatalog-TGA
  version: 0.1.0
  stand: "2026-09-27"
  kapitel: ["13"]
  hinweis: "Kennwerte aus Recherchen 08, 14, 16, 22 und Beispielen B14, B15, B20. Neue Profile DE-aRdT-TGA (S3), EU-FGas-2024 (S1), EU-GIA-2024 (S1), DE-TrinkwV (S1) sind in regelprofile.yaml noch nicht registriert."

regeln:

# ---------------------------------------------------------------------------
# 13.1 Elektro und Netzwerk
# ---------------------------------------------------------------------------

- id: DE.DIN18015-3.Installationszonen-Wand
  version: 0.1.0
  titel: Leitungsführung in Wänden nur in Installationszonen
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 18015-3", fundstelle: "4.2.1 (Wandzonen), Ausnahme Fertigbauteile/Leichtbau", fassung: "2016-09", status: V, recherche: ["08"]}
  profil: {name: M-Firma, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: vertragsschluss}
  vorbedingung:
    auswahl: "IfcCableCarrierSegment, IfcCableSegment in bzw. an IfcWall; Zonen je Wandfläche aus Öffnungen, Ecken und Decke erzeugt"
    anwendbar_wenn: "DIN 18015 in der Bau- und Leistungsbeschreibung vereinbart (Planungsnorm, E13.1)"
    ausnahmen: ["Überdeckung >= 60 mm aus dem Schichtmodell", "Leitungen in unverfüllten Hohlräumen ausweichfähig (gedämmte Gefache erfüllen das nicht, Auslegung U)"]
  eingaben:
    - {name: leitungsachse, einheit: "m (Polylinie)", quelle: Router}
    - {name: zonen, einheit: "m (Rechtecke je Wandfläche)", quelle: "zonen_generator@1.0"}
    - {name: ueberdeckung, einheit: mm, quelle: "Schichtmodell (Σ Schichtdicken raumseitig vor der Leitung)"}
  pruefung:
    typ: geometrie
    funktion: installationszonen_wand@1.0
    formel: "Leitungsachse ⊂ ⋃ Zonen(ZW-o, ZW-u, ZW-m, ZS-t, ZS-f, ZS-e) ∨ Ausnahme; waagerecht nur in ZW-*, senkrecht nur in ZS-*"
    parameter: {ZW_o_cm: [15, 45], ZW_u_cm: [15, 45], ZW_m_cm: [100, 130], ZS_cm: [10, 30], ZW_breite_max_cm: 30, ZS_breite_max_cm: 20, ueber_tuer_min_cm: 10, ueberdeckung_ausnahme_mm: 60}
    auslegung: {gedaemmtes_gefach_unverfuellt: false}
  grenzwerte:
    - {name: ZW_breite_max, wert: 30, einheit: cm, richtung: max, fundstelle: "DIN 18015-3 4.2.1", status: V}
    - {name: ZS_breite_max, wert: 20, einheit: cm, richtung: max, fundstelle: "DIN 18015-3 4.2.1", status: V}
    - {name: ueberdeckung_ausnahme, wert: 60, einheit: mm, richtung: min, fundstelle: "DIN 18015-3 (Leichtbau)", status: V}
  meldung: "{leitung} verlässt die Installationszone zwischen {von} und {bis}; Überdeckung {ue} mm < 60 mm."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Umweg über die nächste senkrechte Zone (ZS-e, ZS-t, ZS-f)", frei: [leitungsweg]}
    - {art: A3_variante, beschreibung: "Dose in eine Zone verschieben oder Installationsebene >= 60 mm Überdeckung vorsehen"}
  status: V
  beispiel: [keins]
  kapitel: "13.1"
  anforderungen: [ANF-13-02, ANF-13-03]

- id: DE.DIN18015-3.Installationszonen-Decke
  version: 0.1.0
  titel: Installationszonen in Decke und Boden
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 18015-3", fundstelle: "Zonen ZD-r, ZD-t", fassung: "2016-09", status: V, recherche: ["08"]}
  profil: {name: M-Firma, version: 0.1.0}
  schicht: S5
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: vertragsschluss}
  vorbedingung:
    auswahl: "Elektroleitungen in Fußbodenaufbau und Deckenfeld"
  eingaben:
    - {name: leitungsachse, einheit: "m (Polylinie)", quelle: Router}
    - {name: wandabstand, einheit: cm, quelle: Modell}
  pruefung:
    typ: geometrie
    formel: "ZD-r: Breite <= 30 cm, Wandabstand >= 20 cm; ZD-t (Türdurchgang): Wandabstand >= 15 cm; Abstand zu Zonen fremder Gewerke (Estrich) >= 20 cm"
    parameter: {ZD_r_breite_max_cm: 30, ZD_r_wandabstand_min_cm: 20, ZD_t_wandabstand_min_cm: 15, abstand_fremdgewerk_cm: 20}
  grenzwerte:
    - {name: ZD_r_wandabstand_min, wert: 20, einheit: cm, richtung: min, fundstelle: "DIN 18015-3", status: V}
    - {name: abstand_fremdgewerk_min, wert: 20, einheit: cm, richtung: min, fundstelle: "DIN 18015-3", status: V}
  meldung: "{leitung} im Boden/Decke: Wandabstand {a} cm < {grenze} cm."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Trasse auf Zonenabstand verlegen"}
  status: V
  beispiel: [keins]
  kapitel: "13.1"
  anforderungen: [ANF-13-02]

- id: DE.DIN18015-2.Stromkreise
  version: 0.1.0
  titel: Mindestanzahl Steckdosen- und Beleuchtungsstromkreise
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 18015-2; RAL-RG 678", fundstelle: "Mindestausstattung, Stromkreise nach Wohnfläche", fassung: "2021-10", status: V, recherche: ["08"]}
  profil: {name: M-Firma, version: 0.1.0}
