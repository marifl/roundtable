- id: DE.DIN1988-300.Spitzendurchfluss
  version: 0.1.0
  titel: Spitzendurchfluss und Geschwindigkeitsgrenze in Trinkwasserleitungen
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 1988-300", fundstelle: "Spitzendurchfluss (Tab. 3), Fließgeschwindigkeit", fassung: "2012-05", status: V, recherche: ["08", "16"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcPipeSegment in IfcDistributionSystem DOMESTICCOLDWATER/DOMESTICHOTWATER"
    ausnahmen: ["vereinfachtes Verfahren nach DIN EN 806-3 nur bis 6 Wohnungen"]
  eingaben:
    - {name: sum_V_R, einheit: "l/s", quelle: "Armaturen stromabwärts (DAT-13-04)"}
    - {name: d_i, einheit: mm, quelle: Rohrtyp}
  pruefung:
    typ: rechnung
    funktion: tw_spitzendurchfluss@1.0
    formel: "V_S = 1,48 · (ΣV_R)^0,19 − 0,94; v = V_S / (π/4 · d_i²) <= v_max (Hausanschluss 2 m/s, Verbrauchsleitung 5 m/s)"
    parameter: {formel: "tga-dimensionierung.yaml#TW.Spitzendurchfluss", v_max_hausanschluss_m_s: 2.0, v_max_verbrauch_m_s: 5.0}
  grenzwerte:
    - {name: v_max_hausanschluss, wert: 2.0, einheit: "m/s", richtung: max, fundstelle: "DIN 1988-300", status: V}
  meldung: "{segment}: v = {v:.2f} m/s > {vmax} m/s bei V_S = {vs:.3f} l/s."
  alternative:
    - {art: A1_grenzwert, beschreibung: "nächstgrößeres Rohr mit d_i >= d_i,min"}
  status: V
  beispiel: [keins]
  kapitel: "13.2"
  anforderungen: [ANF-13-10]

- id: DE.DVGW-W551.3-Liter
  version: 0.1.0
  titel: Wasserinhalt je Warmwasser-Fließweg ohne Zirkulation höchstens 3 Liter
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DVGW W 551; VDI/DVGW 6023", fundstelle: "Kleinanlage, 3-Liter-Regel", fassung: "W 551:2004; VDI/DVGW 6023:2013", status: V, recherche: ["08", "16"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "jeder Pfad im System DOMESTICHOTWATER vom Speicher bzw. Zirkulationsabzweig zur Zapfstelle"
  eingaben:
    - {name: pfad, einheit: "-", quelle: "Topologie (IfcRelConnectsPorts)"}
    - {name: d_i, einheit: mm, quelle: Rohrtyp}
    - {name: L, einheit: m, quelle: Geometrie}
  pruefung:
    typ: topologie
    funktion: tw_3liter@1.0
    formel: "V_Weg = Σ π/4 · d_i² · L <= 3 l je Fließweg; Zirkulationsleitung zählt nicht"
    parameter: {V_max_l: 3.0}
  grenzwerte:
    - {name: V_max, wert: 3.0, einheit: l, richtung: max, fundstelle: "DVGW W 551", status: V}
  meldung: "Fließweg {speicher} → {zapfstelle}: {v:.2f} l > 3 l ohne Zirkulation."
  alternative:
    - {art: A3_variante, beschreibung: "Speicher bzw. Verteiler näher an die Zapfstelle (Grundriss)"}
    - {art: A2_kompensation, beschreibung: "Zirkulation bis zum Abzweig oder kleinere Nennweite"}
  status: V
  beispiel: [B14]
  kapitel: "13.2"
  anforderungen: [ANF-13-11]

- id: DE.DVGW-W551.Temperaturen
  version: 0.1.0
  titel: Speicheraustritt und Zirkulationsrücklauf
  klasse: R2
  haerte: hart
  quelle: {art: N, werk: "DVGW W 551", fundstelle: "Kleinanlage: Austritt >= 60 °C, Rücklauf >= 55 °C", fassung: "2004", status: V, recherche: ["08"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
