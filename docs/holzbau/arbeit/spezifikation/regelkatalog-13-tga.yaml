    - {name: leerrohr_huep_apz, wert: 25, einheit: mm, richtung: min, fundstelle: "VDE-AR-N 4100", status: V}
  meldung: "Zählerschrank {id}: Bedienbereich durch {objekt} verstellt ({t} m < 1,2 m)."
