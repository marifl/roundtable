  klasse: R3
  haerte: hart
  quelle: {art: N, werk: "DIN VDE 0100-420", fundstelle: "421.7", fassung: "2019-10/2022-06", status: V, recherche: ["08"]}
  profil: {name: DE-aRdT-TGA, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "Schlafräume und Räume aus Bauteilen mit brennbaren Baustoffen unter 'feuerhemmend'"
  eingaben:
    - {name: raumnutzung, einheit: "-", quelle: IfcSpace}
    - {name: bauteilklasse, einheit: "-", quelle: "Schichtmodell (Kapitel 3)"}
