  status: V
  hinweis: "Netzbetreiber-TAB (z. B. Bayern) ergänzen; Neuausgabe der VDE-AR-N 4100 U (DAT-13-10)."
  beispiel: [keins]
  kapitel: "13.1"
  anforderungen: [ANF-13-06]

- id: EU.GIA.10.Glasfaser
  version: 0.1.0
  titel: Glasfaserfähige Infrastruktur und Glasfaserverkabelung im Neubau
  klasse: R2
  haerte: hart
  quelle: {art: G, werk: "Verordnung (EU) 2024/1309 (Gigabit-Infrastrukturverordnung)", fundstelle: "Art. 10", fassung: "anwendbar für Bauanträge ab 2026-02-12", status: V, recherche: ["08"]}
  profil: {name: EU-GIA-2024, version: 0.1.0}
  schicht: S1
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: "2026-02-12", bis: null, stichtag: eingang_bauvorlagen}
  vorbedingung:
    auswahl: "IfcBuilding (Neubau)"
    ausnahmen: ["Zugangspunkt nur bei Mehrparteiengebäuden Pflicht"]
  eingaben:
    - {name: datum_bauantrag, einheit: "-", quelle: Verfahren}
    - {name: n_WE, einheit: "-", quelle: regelprofile.yaml}
  pruefung:
    typ: ids
    formel: "∃ IfcDistributionSystem DATA|COMMUNICATION mit IfcCableCarrierSegment (Leerrohr HÜP/APL → Wohnung) und IfcCableSegment OPTICALCABLESEGMENT bis Netzabschlusspunkt (IfcCommunicationsAppliance OPTICALNETWORKUNIT); n_WE > 1: zusätzlich Zugangspunkt"
    ids: "HRB-TGA-GIA (Kapitel 13.14)"
  grenzwerte:
    - {name: stichtag, wert: "2026-02-12", einheit: "-", richtung: gleich, fundstelle: "GIA Art. 10", status: V}
  meldung: "Bauantrag ab 12.02.2026: Glasfaserverkabelung bis zum Netzabschlusspunkt fehlt."
  alternative:
    - {art: A2_kompensation, beschreibung: "Glasfaser-Teilsystem aus Vorlage einfügen"}
  status: V
  hinweis: "§ 145 Abs. 4 TKG wird durch die GIA überlagert (Recherche 08)."
  beispiel: [keins]
  kapitel: "13.1"
  anforderungen: [ANF-13-07]

- id: DE.DIN4108-7.Luftdichte-Durchdringung
  version: 0.1.0
  titel: Jede Durchdringung der luftdichten Ebene ist abgedichtet
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 4108-7; DIN 18015-5; BDF-Merkmal Luftdichtheit", fundstelle: "Durchdringungen, luftdichte Dosen", fassung: "DIN 4108-7 geltende Fassung; DIN 18015-5 Ausgabejahr U", status: V, recherche: ["08", "16"]}
  profil: {name: DE-aRdT-TGA, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcOpeningElement bzw. IfcVirtualElement PROVISIONFORVOID in einer Schicht mit luftdicht = true"
  eingaben:
    - {name: d_a, einheit: mm, quelle: Leitung}
    - {name: manschetten, einheit: mm, quelle: "tga-dimensionierung.yaml#manschetten (DAT-13-05)"}
  pruefung:
    typ: topologie
    formel: "∃ IfcRelFillsElement(Öffnung → IfcDiscreteAccessory Luftdichtheitsmanschette mit d_min <= d_a <= d_max) ∨ Dose vom Typ luftdicht; Leerrohre innen abgedichtet"
  grenzwerte: []
  meldung: "{oeffnung} durchdringt die luftdichte Ebene {schicht} ohne passende Manschette (d_a = {d} mm)."
  alternative:
    - {art: A3_variante, beschreibung: "Leitung in der Installationsebene führen"}
    - {art: A2_kompensation, beschreibung: "freigegebene Manschette bzw. luftdichte Dose wählen"}
  status: V
  beispiel: [B15]
  kapitel: "13.1, 13.9"
  anforderungen: [ANF-13-09]
  tests: [tests/test_b15.py::test_manschette_und_brandschutz]

