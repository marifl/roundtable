  alternative:
    - {art: A2_kompensation, beschreibung: "zusätzlichen Stromkreis im Verteiler vorsehen"}
  status: V
  beispiel: [keins]
  kapitel: "13.1"
  anforderungen: [ANF-13-05]

- id: DE.VDE0100-701.Schutzbereiche
  version: 0.1.0
  titel: Schutzbereiche in Räumen mit Badewanne oder Dusche
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN VDE 0100-701", fundstelle: "Bereiche 0, 1, 2; Betriebsmittel, Leitungsführung", fassung: "2008-10", status: V, recherche: ["08"]}
  profil: {name: DE-aRdT-TGA, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcSanitaryTerminal BATH/SHOWER; IfcOutlet, IfcSwitchingDevice, IfcLightFixture, IfcCableSegment im selben IfcSpace"
  eingaben:
    - {name: sanitaerobjekt, einheit: "m (Umriss, Höhe fester Wasserauslass)", quelle: Modell}
    - {name: betriebsmittel, einheit: "-", quelle: Modell}
  pruefung:
    typ: geometrie
    funktion: schutzbereiche_701@1.0
    formel: "Bereich 1 = Extrusion Umriss bis max(2,25 m; höchster fester Auslass); bodengleiche Dusche r = 1,20 m; Bereich 2 = +0,60 m; Steckdosen in Bereich 2 nur SELV/PELV/Rasiersteckdose; IPX4; Leitungen zu Bereich 1 senkrecht von oben/hinten; raumfremde Leitungen >= 6 cm Restwand oder RCD <= 30 mA"
    parameter: {bereich1_hoehe_m: 2.25, radius_dusche_m: 1.20, bereich2_m: 0.60, restwand_cm: 6, schutzart: IPX4}
  grenzwerte:
    - {name: bereich1_hoehe, wert: 2.25, einheit: m, richtung: gleich, fundstelle: "VDE 0100-701", status: V}
    - {name: bereich2_breite, wert: 0.60, einheit: m, richtung: gleich, fundstelle: "VDE 0100-701", status: V}
  meldung: "{objekt} liegt in Schutzbereich {bereich} der {sanitaer}; zulässig nur {zulaessig}."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Betriebsmittel außerhalb des Bereichs platzieren (Abstand {d} m)"}
    - {art: A2_kompensation, beschreibung: "SELV/PELV oder Rasiersteckdose statt Steckdose"}
  status: V
  hinweis: "Bereich 0 bei Dusche ohne Wanne (Höhe) ist U."
  beispiel: [keins]
  kapitel: "13.1"
  anforderungen: [ANF-13-04]

- id: DE.VDE0100-420.AFDD-Bewertung
