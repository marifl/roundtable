  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "VDE-AR-N 4100 (TAR Niederspannung); DIN VDE 0603", fundstelle: "Zählerplatz, APZ, Bedienbereich", fassung: "2019-04", status: V, recherche: ["08"]}
  profil: {name: DE-aRdT-TGA, version: 0.1.0}
  schicht: S3
  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcDistributionBoard mit Zählerfeld; IfcSpatialZone RESERVATION davor"
  eingaben:
    - {name: schrank, einheit: "mm (Maße)", quelle: Katalog}
    - {name: freiraum, einheit: m, quelle: Modell}
