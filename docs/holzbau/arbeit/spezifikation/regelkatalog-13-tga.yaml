    formel: "Zählerfeld 450 mm (eHZ 300 + RfZ 150); APZ-Raum >= 300 mm; Leerrohr HÜP–APZ >= 25 mm; Bedienbereich 1,2 m tief × 2,0 m hoch frei von Bauteilen und Möbeln"
    parameter: {tabelle: "tga-dimensionierung.yaml#zaehlerplatz_VDE-AR-N4100"}
