  geltung:
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: vertragsschluss}
  vorbedingung:
    auswahl: "IfcDistributionCircuit je Wohnung (IfcZone Wohnung)"
    r2_voraussetzung: [DE-R2-Wohnflaeche-WoFlV]
  eingaben:
    - {name: wohnflaeche, einheit: "m²", quelle: DE.WoFlV.Wohnflaeche}
    - {name: ausstattungsstufe, einheit: "-", quelle: "Bau- und Leistungsbeschreibung (RAL-RG 678, DAT-13-10)"}
