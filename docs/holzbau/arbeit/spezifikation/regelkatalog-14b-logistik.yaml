    - {name: laenge_gesamt, wert: 20.75, einheit: m, richtung: max, fundstelle: "§ 22 Abs. 4 StVO", status: V}
  meldung: "Die Ladung ragt {ist:.2f} m hinaus; zulässig sind {soll:.2f} m."
  alternative:
    - {art: A3_variante, beschreibung: "Plateau mit größerer Ladelänge oder Element teilen", frei: [fahrzeug.art, elementierung]}
  status: V
  beispiel: [B18]
  kapitel: "14b.4"
  hinweis: "Anforderung ANF-14b-11."

- id: BY.AGBGB.46b.Ueberschwenken
  version: 0.1.0
  titel: Anzeige des Überschwenkens des Nachbargrundstücks
  klasse: R4
  haerte: hart
  quelle: {art: G, werk: "BayAGBGB; BGB", fundstelle: "Art. 46b Abs. 1, 3 BayAGBGB; § 905 BGB; OLG München 8 U 5531/20", fassung: "geltend 2026-09", status: V, recherche: ["19"]}
  profil: {name: BY-AGBGB, version: 0.1.0}
  schicht: S1
  geltung:
    raum: Bayern
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "Hakenweg, Ausleger oder Heck über fremdem Grundstück (mit oder ohne Last)"
  eingaben:
    - {name: huebe_ueber_nachbar, einheit: "-", quelle: Hubplanung}
    - {name: montagetermin, einheit: "-", quelle: IfcWorkSchedule}
    - {name: anzeige_datum, einheit: "-", quelle: Dokument}
  pruefung:
    typ: vollstaendigkeit
    funktion: ueberschwenken@0.1
    formel: "wenn huebe_ueber_nachbar > 0 oder Ausleger lastfrei über Nachbar: Anzeige an Eigentümer und Nutzungsberechtigte spätestens montagetermin − 1 Monat; ohne Anzeige: verletzt; bei Ablehnung: freigabepflichtig (Duldungsklage, keine Selbsthilfe)"
    parameter: {frist_monate: 1}
  grenzwerte:
    - {name: vorlauf, wert: 1, einheit: Monat, richtung: min, fundstelle: "Art. 46b Abs. 3 BayAGBGB (über OLG München)", status: V}
  meldung: "{n} Hübe führen über das Grundstück {flst}. Die Anzeige an Eigentümer und Nutzungsberechtigte muss bis {frist} erfolgen."
  alternative:
    - {art: A3_variante, beschreibung: "Stellplatz ohne Lasthub über Nachbargrund", frei: [kran.stellplatz]}
    - {art: A5_freigabeweg, beschreibung: "schriftliche Zustimmung des Nachbarn"}
  status: V
  beispiel: [B18]
  kapitel: "14b.3.2"
  hinweis: "Anforderungen ANF-14b-10, ANF-14b-15. Gesetzestext nur über das Urteil zitiert [V mittelbar]; keine Rechtsauskunft."

- id: BY.M-MOR.Haltverbot
  version: 0.1.0
  titel: Vorübergehendes Haltverbot für die Abladezone
  klasse: R4
  haerte: hart
  quelle: {art: G, werk: "Mobilitätsreferat München (MOR-GB2.3), verkehrsrechtliche Anordnung", fundstelle: "Leistung 1072585; Antrag HV Umzug/Baustelle (29.01.2025)", fassung: "Stand 2025/26", status: V, recherche: ["19"]}
  profil: {name: BY-M-Mobilitaetsreferat, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "IfcSpatialZone TRANSPORT (Abladezone) auf öffentlichem Verkehrsgrund"
  eingaben:
    - {name: gueltig_ab, einheit: "-", quelle: IfcWorkSchedule}
    - {name: antrag_datum, einheit: "-", quelle: Dokument}
  pruefung:
    typ: vollstaendigkeit
    funktion: haltverbot@0.1
    formel: "Schilder spätestens am 4. Tag vor gueltig_ab (3 volle Kalendertage); Antrag spätestens 10 Arbeitstage vor dem Aufstelldatum; Unterlagen: Antrag, bemaßte Skizze, Vornotierungsliste"
    parameter: {bearbeitung_arbeitstage: 10, schilder_vorlauf_tage: 3}
  grenzwerte:
    - {name: bearbeitung, wert: 10, einheit: Arbeitstag, richtung: min, fundstelle: "stadt.muenchen.de 1072585", status: V}
    - {name: schilder_vorlauf, wert: 3, einheit: d, richtung: min, fundstelle: "stadt.muenchen.de 1072585", status: V}
  meldung: "Für die Abladezone am {datum} muss das Haltverbot bis {antrag} beantragt und die Beschilderung bis {schilder} aufgestellt sein."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Montagetermin verschieben", frei: [montage.termin]}
  status: V
  beispiel: [B18]
  kapitel: "14b.5"
  hinweis: "Anforderung ANF-14b-15. T = 12.10.2026: Schilder bis 08.10.2026, Antrag spätestens 24.09.2026 (Plan 21.09.2026)."

- id: BY.M-MOR.Sondernutzung-Kran
  version: 0.1.0
  titel: Kran auf öffentlichem Grund
  klasse: R4
  haerte: hart
  quelle: {art: G, werk: "Mobilitätsreferat München; StVO § 45", fundstelle: "Leistung 1072250; Antragsformular Baustelle privat", fassung: "Stand 2025/26", status: V, recherche: ["19"]}
  profil: {name: BY-M-Mobilitaetsreferat, version: 0.1.0}
  schicht: S1
  geltung:
    raum: "Landeshauptstadt München"
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "Kranstellung oder Abstützung auf öffentlichem Verkehrsgrund"
  eingaben:
    - {name: auf_strasse, einheit: "-", quelle: Stellplatzwahl}
    - {name: antrag_datum, einheit: "-", quelle: Dokument}
    - {name: montagetermin, einheit: "-", quelle: IfcWorkSchedule}
  pruefung:
    typ: vollstaendigkeit
    funktion: sondernutzung_kran@0.1
    formel: "wenn auf_strasse: Sondernutzungserlaubnis und verkehrsrechtliche Anordnung; Antrag mit Vorlauf (Planwert 6 Wochen [U]), MVAS-Zertifikat, Verkehrszeichenplan nach RSA 21, bemaßter Plan, Angabe vor benachbartem Anwesen"
    parameter: {vorlauf_plan_wochen: 6}
    auslegung: {vorlauf: "Bearbeitungsdauer schwankt; 2018/19 im Mittel 3,2 bzw. 5,3 Wochen, Spitzen 7 Wochen [U aktuell]"}
  grenzwerte:
    - {name: vorlauf_plan, wert: 6, einheit: Woche, richtung: min, fundstelle: "Zeitstrahl Recherche 19 (abgeleitet)", status: U}
  meldung: "Der Kran steht auf öffentlichem Grund. Sondernutzung und verkehrsrechtliche Anordnung sind bis {frist} zu beantragen."
  alternative:
    - {art: A3_variante, beschreibung: "Stellplatz auf dem Grundstück (gegebenenfalls größerer Kran)", frei: [kran.stellplatz, kran.id]}
  status: U
  beispiel: [B18]
  kapitel: "14b.5"
  hinweis: "Anforderung ANF-14b-15. Szenario einfahrt_belegt: AK-60 auf der Straße."

- id: DE.BaustellV.2-3.Vorankuendigung-SiGe
  version: 0.1.0
  titel: Vorankündigung, SiGe-Plan und Koordinator
  klasse: R4
  haerte: hart
  quelle: {art: G, werk: "Baustellenverordnung (BaustellV)", fundstelle: "§§ 2, 3, Anhang I und II", fassung: "geltend 2026-09", status: V, recherche: ["19"]}
  profil: {name: DE-Arbeitsschutz-Bau, version: 0.1.0}
  schicht: S1
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "Baustelle (IfcWorkSchedule)"
  eingaben:
    - {name: arbeitstage, einheit: d, quelle: Bauzeitplan}
    - {name: beschaeftigte_gleichzeitig, einheit: "-", quelle: Bauzeitplan}
    - {name: personentage, einheit: d, quelle: Bauzeitplan}
    - {name: arbeitgeber, einheit: "-", quelle: Beteiligte}
    - {name: gefaehrliche_arbeiten, einheit: "-", quelle: "Anhang II (Absturz > 7 m, < 5 m Hochspannung, Massivbauelemente mit Hebezeug)"}
  pruefung:
    typ: vollstaendigkeit
    funktion: baustellv@0.1
    formel: "Vorankündigung >= 2 Wochen vor Einrichtung, wenn (arbeitstage > 30 und beschaeftigte_gleichzeitig > 20) oder personentage > 500; SiGe-Plan, wenn arbeitgeber > 1 und (Vorankündigung oder gefaehrliche_arbeiten); Koordinator, wenn arbeitgeber > 1; Holzelemente als Massivbauelemente: unbestimmt mit Empfehlung SiGe-Plan"
    parameter: {arbeitstage: 30, beschaeftigte: 20, personentage: 500, vorlauf_wochen: 2}
  grenzwerte:
    - {name: vorlauf, wert: 2, einheit: Woche, richtung: min, fundstelle: "§ 2 Abs. 2 BaustellV", status: V}
    - {name: personentage, wert: 500, einheit: d, richtung: max, fundstelle: "§ 2 Abs. 2 BaustellV", status: V}
  meldung: "Für die Baustelle ist {pflicht} erforderlich (Frist {frist})."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "SiGe-Koordinator bestellen und SiGe-Plan erstellen lassen"}
  status: V
  beispiel: [B18]
  kapitel: "14b.5"
  hinweis: "Anforderung ANF-14b-16. Einordnung von Holztafeln unter Anhang II Nr. 10 ungeklärt [U]."

- id: M.Firma.Montagereihenfolge
  version: 0.1.0
  titel: Montagereihenfolge der Elemente
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Firmenregel Montage", fundstelle: "B18 prüfe_reihenfolge", fassung: "0.1", status: U, recherche: ["19"]}
  profil: {name: M-Firma, version: 0.1.0}
  schicht: S5
  geltung:
    raum: alle
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "IfcTask INSTALLATION mit IfcRelSequence"
  eingaben:
    - {name: reihenfolge, einheit: "-", quelle: IfcWorkSchedule}
    - {name: elementtyp, einheit: "-", quelle: Modell}
