  beispiel: [B18]
  kapitel: "14b.6.1"
  tests: [tests/test_b18.py::test_haus_und_reihenfolge, tests/test_b18.py::test_zeitplan]
  hinweis: "Anforderungen ANF-14b-12, ANF-14b-13, ANF-14b-14."

