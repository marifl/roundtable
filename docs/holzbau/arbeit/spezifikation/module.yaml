# Modulzerlegung der App (Kapitel 7.5, Tabelle 7.5; Schema: Kapitel 7.9.2, Struktur E).
# Lizenzangaben aus den Recherchen 01, 03, 05, 08, 09, 10, 16, 18, 20, 22 (Status V/U); keine Rechtsauskunft.
# urteil: uebernehmen | adaptieren | selbst_bauen | meiden | lizenzieren
# einbindung: bibliothek | prozess | dienst | referenz | daten
# anforderungen: vorläufige Zuordnung; jede ANF-ID steht bei genau einem Modul (geprüft).
# teilmodule: feinere Modulnamen aus intents.yaml (Kapitel 10), jeder genau einem Modul zugeordnet.

stand: "2026-09-27"
version: 0.1.0
kapitel: ["7"]

module:

- name: sprache-asr
  zweck: "Sprache → Transkript mit Zeitmarken, lokal, mit Fachbegriff-Boosting; keine Sprechererkennung, kein Rohaudio über die Sitzung hinaus"
  ki_system: true
  teilmodule: []
  schnittstellen:
    eingaben: ["Audio-Stream (lokal)", "Fachbegriffsliste (DAT-07-03)"]
    ausgaben: ["Transkript mit Zeitmarken"]
  abhaengigkeiten: [betrieb]
  bausteine:
    - {name: "Voxtral Mini 4B Realtime 2602", urteil: uebernehmen, lizenz: "Apache-2.0", status: V, einbindung: bibliothek, quelle: "Recherche 03"}
    - {name: "Parakeet-TDT-0.6b-v3", urteil: uebernehmen, lizenz: "CC-BY-4.0", status: V, einbindung: bibliothek, quelle: "Recherche 03", hinweis: "wenn Phrase Boosting für Fachbegriffe entscheidet"}
    - {name: "Whisper large-v3-turbo", urteil: uebernehmen, lizenz: "MIT", status: V, einbindung: bibliothek, quelle: "Recherche 03; radford2023whisper", hinweis: "Fallback ohne echtes Streaming"}
  anforderungen: [ANF-06-30, ANF-06-31]

- name: intent
  zweck: "Transkript + Zustand → Wahrscheinlichkeiten über typisierte Fragen (choice ≤ 20, score, noul); keine Werte, kein Text"
  ki_system: true
  teilmodule: []
  schnittstellen:
    eingaben: ["Transkript", "Intent-Katalog (hierarchisch)", "Zustand"]
    ausgaben: ["Struktur A: Intent-Antwort"]
  abhaengigkeiten: [betrieb]
  bausteine:
    - {name: "Laya (convaiinnovations/laya-multilingual)", urteil: adaptieren, lizenz: "Apache-2.0", status: V, einbindung: dienst, quelle: "Recherche 03", hinweis: "Fine-Tuning und Kalibrierung Pflicht; Jev-kompatibler Server"}
    - {name: "Jev (typesafe-ai/jev, Vercel AI Gateway)", urteil: uebernehmen, lizenz: "Dienst", status: V, einbindung: dienst, quelle: "Recherche 03", hinweis: "Fallback, nur mit Einwilligung und Zero Data Retention"}
    - {name: "Stichwort-Klassifikator (Muster Shapeshift)", urteil: selbst_bauen, lizenz: "eigen (Vorbild MIT)", status: V, einbindung: bibliothek, quelle: "Recherche 03", hinweis: "Offline-Fallback"}
  anforderungen: [ANF-07-01, ANF-07-04, ANF-07-05, ANF-07-21]

- name: dialog
  zweck: "Schwellwerte je Frage, deutscher Werteparser, Referenzauflösung, Rückfragen mit Optionen aus L(P), Meldungen aus Katalogtexten"
  ki_system: false
  teilmodule: [dialog]
  schnittstellen:
    eingaben: ["Struktur A", "Transkript", "Zustand (lesend)"]
    ausgaben: ["Struktur B: Änderungsvorschlag", "Rückfrage", "Antworttext aus Katalog"]
  abhaengigkeiten: [sprache-asr, intent, parametermodell, regelmaschine]
  bausteine:
    - {name: "Werteparser und Resolver (B6)", urteil: selbst_bauen, lizenz: "eigen", status: V, einbindung: bibliothek, quelle: "beispiele/b6_intent_pipeline.py"}
  anforderungen: [ANF-09-15, ANF-06-10, ANF-06-35, ANF-07-02, ANF-07-03, ANF-07-06]

- name: parametermodell
  zweck: "einzige Schreibschnittstelle: Zustand x, Ereignisquelle, Pfade, Undo, Varianten, ParameterHash"
  ki_system: false
  teilmodule: [parametermodell]
  schnittstellen:
    eingaben: ["Struktur B", "Ergebnis der Regelmaschine", "Hausmodell aus katalog"]
    ausgaben: ["Struktur C: Ereignis", "Zustand x (kanonisches JSON)", "ParameterHash"]
  abhaengigkeiten: [katalog, regelmaschine, assistenz, ifc-generator, cde, audit]
  bausteine:
    - {name: "Ereignisspeicher mit Momentaufnahmen", urteil: selbst_bauen, lizenz: "eigen", status: U, einbindung: bibliothek, quelle: "Kapitel 7.3.2"}
  anforderungen: [ANF-06-20, ANF-06-26, ANF-07-07, ANF-07-09, ANF-07-19, ANF-07-22]

- name: regelmaschine
  zweck: "Kataloge und Profile laden und prüfen (Schema, Monotonie), Profil aus Merkmalsvektor, fünfwertige Prüfung, Projektion auf L(P), Konfliktmenge, Alternativen, Abhängigkeitsgraph"
