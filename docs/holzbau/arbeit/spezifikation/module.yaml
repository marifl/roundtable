  teilmodule: [regelmaschine, profilableitung]
  schnittstellen:
    eingaben: ["Zustand x", "Kontext c", "regelkatalog*.yaml", "regelprofile.yaml"]
    ausgaben: ["Prüfergebnis je Regel", "Konfliktmenge", "Alternative A1–A5", "Grenzwerte vorab"]
  abhaengigkeiten: [solver, fachmodule, geodaten, katalog]
  bausteine:
