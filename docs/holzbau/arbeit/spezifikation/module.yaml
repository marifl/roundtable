    - {name: "jsonschema", urteil: uebernehmen, lizenz: "MIT", status: U, einbindung: bibliothek, quelle: "Kapitel 9.9.1"}
    - {name: "PyYAML", urteil: uebernehmen, lizenz: "MIT", status: U, einbindung: bibliothek, quelle: "Kapitel 9.9.1"}
    - {name: "OpenBIMRL (Vorberechnungsgraph)", urteil: adaptieren, lizenz: "nicht geprüft", status: U, einbindung: referenz, quelle: "stepien2023openbimrl"}
  anforderungen: [ANF-03-07, ANF-03-08, ANF-03-09, ANF-09-01, ANF-09-02, ANF-09-05, ANF-09-06, ANF-09-07, ANF-09-08, ANF-09-09, ANF-09-10, ANF-09-11, ANF-09-13, ANF-09-14, ANF-09-19, ANF-09-20, ANF-09-22, ANF-09-24, ANF-09-25, ANF-09-29, ANF-09a-01, ANF-09a-02, ANF-09a-03, ANF-09a-04, ANF-09a-05, ANF-09a-06, ANF-09a-10, ANF-09a-13, ANF-09a-15, ANF-09a-16, ANF-09a-17, ANF-09a-18]

