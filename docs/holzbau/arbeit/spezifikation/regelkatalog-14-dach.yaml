- id: DE.FR01.Holzschalung
  version: 0.1.0
  titel: Außenwandbekleidung aus Holz nach Fachregel 01
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "Fachregel 01 Zimmerer: Außenwandbekleidungen aus Holz; Ausschreibungshilfe Holzbau Deutschland 2021; BauNetz Wissen", fundstelle: "Geltung, Brettmaße, Sockel", fassung: "2023-03", status: V, recherche: ["09"]}
  profil: {name: DE-Handwerk-Zimmerer, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2023-03-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcCovering CLADDING aus Holz"
    anwendbar_wenn: "Firsthöhe <= 10 m"
  eingaben:
    - {name: firsthoehe, einheit: m, quelle: Modell}
    - {name: brett_dicke, einheit: mm, quelle: Bemusterung}
    - {name: brett_breite, einheit: mm, quelle: Bemusterung}
    - {name: befestigung_anzahl, einheit: "-", quelle: Modell}
    - {name: sockelabstand, einheit: mm, quelle: Modell}
    - {name: kiesstreifen, einheit: "-", quelle: Modell}
  pruefung:
    typ: rechnung
    funktion: holzschalung@0.1
    formel: "nicht_anwendbar mit Hinweis, wenn firsthoehe > 10 m; verletzt, wenn brett_dicke < 18 mm oder brett_breite > 11·brett_dicke oder (brett_breite >= 120 mm und befestigung_anzahl < 2) oder sockelabstand < 300 mm (mit Kiesstreifen 16/32: < 150 mm)"
    parameter: {firsthoehe_max_m: 10, dicke_min_mm: 18, breite_faktor_max: 11, zweifach_ab_mm: 120, sockel_mm: 300, sockel_kies_mm: 150}
  grenzwerte:
    - {name: firsthoehe, wert: 10, einheit: m, richtung: max, fundstelle: "FR 01 (Geltung)", status: V}
    - {name: brett_dicke, wert: 18, einheit: mm, richtung: min, fundstelle: "Ausschreibungshilfe 2021", status: V}
    - {name: breite_zu_dicke, wert: 11, einheit: "-", richtung: max, fundstelle: "Ausschreibungshilfe 2021", status: V}
    - {name: sockelabstand, wert: 300, einheit: mm, richtung: min, fundstelle: "BauNetz Wissen nach FR 01", status: V}
  meldung: "Das Profil {dicke} × {breite} mm überschreitet die zulässige Breite von {bmax} mm."
  alternative:
    - {art: A3_variante, beschreibung: "dickeres Brett (Grenze 11 · Dicke) oder schmaleres Profil", frei: [fassade.brett_dicke, fassade.brett_breite]}
  status: V
  beispiel: [keins]
  kapitel: "14.7.1"
  anforderungen: [ANF-14-24]
  hinweis: "Hinterlüftungsquerschnitte und Insektenschutz aus FR 01-Volltext nachtragen (DAT-14-11)."

