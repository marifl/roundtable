# Regelkatalog Kapitel 14: Dach, Fassade und Einbauteile.
# Schema: regel.schema.json (#/$defs/regel). Ergebniswerte: erfuellt | verletzt | unbestimmt |
# nicht_anwendbar | freigabepflichtig (Kapitel 9.2.1).
# Normwerte sind Einzelkennwerte mit Fundstelle, keine Tabellenkopien (Kapitel 9.7).
# Werte der ZVDH-Fachregel mit Fundstelle "Gelbdruck 07/2023" stammen aus der Einspruchsfassung
# und tragen Status U, bis sie gegen die Endfassung 04/2024 geprüft sind (Recherche 09, DAT-14-11).
# Bestehende Regel, auf die dieser Katalog aufbaut: DE.ZVDH.DZ.Dachneigung (regelkatalog.yaml).
# Neu verwendete Profile, in regelprofile.yaml noch nachzutragen:
#   DE-EEG-2023 (S1), M-Hersteller-Dach (S5), DE-Handwerk-Zimmerer (S3).

katalog:
  name: HRB-Regelkatalog-14-Dach
  version: 0.1.0
  stand: "2026-09-27"
  kapitel: ["14"]
  hinweis: "Regeln aus Kapitel 14 (Recherche 09, Beispiele B17/B18, geplantes B21). Anforderungen ANF-14-xx in Abschnitt 14.10.2."

regeln:

# ---------------------------------------------------------------------------
# 14.1 Geometrie
# ---------------------------------------------------------------------------

- id: M.Firma.Dachskelett-Plausibel
  version: 0.1.0
  titel: Plausibilität der Dachgeometrie aus gewichtetem Straight Skeleton
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Firmenregel Dachgenerator", fundstelle: "E14.1, E14.2", fassung: "0.1", status: U, bib: [held2017roofs, biedl2015weighted, ahn2013roofs, eder2018volume, eder2021exact], recherche: ["09", "25"]}
  profil: {name: M-Firma, version: 0.1.0}
  schicht: S5
  geltung:
    raum: alle
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "IfcRoof mit PredefinedType ungleich FLAT_ROOF"
    r2_voraussetzung: [HRB-R2-Grundriss-Polygon, HRB-R2-Neigung-je-Kante]
  eingaben:
    - {name: grundriss, einheit: "m (Polygon)", quelle: Modell, beschreibung: "Traufumriss einschließlich Überstand"}
    - {name: neigung_je_kante, einheit: "°", quelle: Modell, beschreibung: "0 = Giebel (Gewicht 0)"}
    - {name: traufhoehe_je_kante, einheit: m, quelle: Modell}
  pruefung:
    typ: geometrie
    funktion: dachskelett@0.1
    formel: "S = gewichtetes Straight Skeleton (multiplikativ tan-Gewichte, additiv Traufhöhen), exakte Arithmetik; verletzt, wenn S nicht planar oder zyklisch, eine Fläche nicht eben (> 0,1 mm), eine Fläche ohne Traufkante oder ein innerer Tiefpunkt existiert"
    parameter: {ebenheit_toleranz_mm: 0.1, rundung_uebergabe_mm: 0.1}
  grenzwerte:
    - {name: ebenheit_toleranz, wert: 0.1, einheit: mm, richtung: max, fundstelle: "E14.2 (Festlegung)", status: U}
  meldung: "Die gewünschten Neigungen {neigungen} ergeben kein gültiges Dach: {grund}."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Neigung der betroffenen Kante auf den nächsten gültigen Wert setzen", frei: [dach.kante.neigung]}
    - {art: A3_variante, beschreibung: "Dachform wechseln (Walm statt Krüppelwalm, Satteldach statt Walm)", frei: [dach.form]}
  status: U
  beispiel: [B21]
  kapitel: "14.1.3"
  anforderungen: [ANF-14-01, ANF-14-02, ANF-14-03]
  hinweis: "Referenzwerte (eigene Rechnung, Beispiel 14.1): 13,00 x 11,00 m, 35°: First 2,000 m, Firsthöhe 3,851 m, Grat 8,679 m; Walm 45°: First 5,298 m."

- id: DE.ZVDH.DZ.Kehlneigung
  version: 0.1.0
  titel: Kehlart in Abhängigkeit von der Kehlneigung
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "4.6.1 Tab. 21 (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "Kante mit Kantenart KEHLE"
  eingaben:
    - {name: kehlneigung_beta, einheit: "°", quelle: Modell, beschreibung: "aus dem Skelett; bei 90°-Ecke und gleicher Neigung tan β = tan α / √2"}
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: kehlart, einheit: "-", quelle: Bemusterung}
  pruefung:
    typ: rechnung
    funktion: kehlart@0.1
    formel: "METALL: dachneigung >= 10°; NOCKEN, BIBER_EINGEBUNDEN: beta >= 25°; BIBER_UEBERDECKT: beta >= 30°; DREIPFANNEN, FORMZIEGEL, SCHWENKZIEGEL: beta >= 35°. Vorab-Grenzwert alpha_min = atan(tan(beta_min)·√2)"
    parameter: {grenze_metall_dachneigung_grad: 10, grenze_nocken_grad: 25, grenze_biber_ueberdeckt_grad: 30, grenze_dreipfannen_grad: 35}
  grenzwerte:
    - {name: metallkehle_dachneigung, wert: 10, einheit: "°", richtung: min, fundstelle: "FR 4.6.1 Tab. 21 (Gelbdruck)", status: U}
    - {name: nockenkehle_kehlneigung, wert: 25, einheit: "°", richtung: min, fundstelle: "FR 4.6.1 Tab. 21 (Gelbdruck)", status: U}
    - {name: biberkehle_ueberdeckt_kehlneigung, wert: 30, einheit: "°", richtung: min, fundstelle: "FR 4.6.1 Tab. 21 (Gelbdruck)", status: U}
    - {name: dreipfannenkehle_kehlneigung, wert: 35, einheit: "°", richtung: min, fundstelle: "FR 4.6.1 Tab. 21 (Gelbdruck)", status: U}
  meldung: "Die Kehle hat eine Neigung von {beta:.1f}°. Die {kehlart} verlangt mindestens {grenze}°. Ab einer Dachneigung von {alpha_min:.1f}° wäre sie zulässig."
  alternative:
    - {art: A3_variante, beschreibung: "Metallkehle oder andere zulässige Kehlart wählen", frei: [kehle.art]}
    - {art: A1_grenzwert, beschreibung: "Dachneigung auf alpha_min erhöhen", frei: [dach.neigung]}
  status: U
  beispiel: [B21]
  kapitel: "14.1.5"
  anforderungen: [ANF-14-04]

- id: DE.ZVDH.DZ.Kehlueberdeckung
  version: 0.1.0
  titel: Überdeckung der Kehle durch die Dachfläche
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "4.6.1 (6) (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "geschnittene Ziegel entlang einer Kante KEHLE"
  eingaben:
    - {name: ueberdeckung_min, einheit: mm, quelle: "Musterausbreitung", beschreibung: "kleinster Abstand Ziegelschnitt zur Kehllinie, rechtwinklig gemessen"}
  pruefung:
    typ: geometrie
    funktion: kehle_ueberdeckung@0.1
    formel: "min über alle Kehlziegel der rechtwinklig zur Kehllinie gemessenen Überdeckung >= 100 mm"
    parameter: {ueberdeckung_min_mm: 100}
  grenzwerte:
    - {name: ueberdeckung, wert: 100, einheit: mm, richtung: min, fundstelle: "FR 4.6.1 (6) (Gelbdruck)", status: U}
  meldung: "Die Deckung überdeckt die Kehle nur {ist} mm, gefordert sind 100 mm."
  alternative:
    - {art: A2_kompensation, beschreibung: "Kehlbreite oder Schnittlinie der Kehlziegel anpassen", frei: [kehle.breite]}
  status: U
  beispiel: [B21]
  kapitel: "14.3.5"
  anforderungen: [ANF-14-12]

- id: DE.ZVDH.DZ.Traufe
  version: 0.1.0
  titel: Traufausbildung und Traufblech
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "4.1 (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "Kante mit Kantenart TRAUFE"
  eingaben:
    - {name: ueberstand_deckung, einheit: mm, quelle: Modell, beschreibung: "Überstand der Deckung über die Traufkonstruktion"}
    - {name: traufblech, einheit: "-", quelle: Modell}
    - {name: traufreihe_neigung_gleich, einheit: "-", quelle: Modell}
  pruefung:
    typ: aufzaehlung
    funktion: traufe@0.1
    formel: "verletzt, wenn ueberstand_deckung < 50 mm und kein Traufblech; verletzt, wenn die Traufreihe nicht die Neigung der Fläche hat (Traufbohle oder Doppellatte fehlt); Lüftungsebene an der Traufe offen"
    parameter: {ueberstand_min_ohne_traufblech_mm: 50}
  grenzwerte:
    - {name: ueberstand_ohne_traufblech, wert: 50, einheit: mm, richtung: min, fundstelle: "FR 4.1 (Gelbdruck)", status: U}
  meldung: "Die Deckung steht an der Traufe nur {ist} mm über; ein Traufblech ist erforderlich."
  alternative:
    - {art: A2_kompensation, beschreibung: "Traufblech ergänzen", frei: [traufe.traufblech]}
    - {art: A1_grenzwert, beschreibung: "Überstand der Deckung auf 50 mm erhöhen", frei: [lattung.LAT]}
  status: U
  beispiel: [B21]
  kapitel: "14.3.5"
  anforderungen: [ANF-14-12]

- id: DE.ZVDH.DZ.Ortgang
  version: 0.1.0
  titel: Ortgangausbildung
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "4.2 (4) (Gelbdruck 07/2023); Creaton", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "Kante mit Kantenart ORTGANG"
  eingaben:
    - {name: ortgang_art, einheit: "-", quelle: Bemusterung, beschreibung: "ORTGANGZIEGEL oder FLAECHENZIEGEL_DOPPELWULST"}
    - {name: abstand_lappen_giebelwand, einheit: mm, quelle: Musterausbreitung}
    - {name: ueberstand_flaechenziegel, einheit: mm, quelle: Musterausbreitung}
  pruefung:
    typ: geometrie
    funktion: ortgang@0.1
    formel: "ORTGANGZIEGEL: abstand_lappen_giebelwand >= 10 mm; FLAECHENZIEGEL_DOPPELWULST: ueberstand_flaechenziegel >= 30 mm"
    parameter: {lappen_abstand_min_mm: 10, ueberstand_min_mm: 30}
  grenzwerte:
    - {name: lappen_abstand, wert: 10, einheit: mm, richtung: min, fundstelle: "FR 4.2 (4); Creaton bestätigt", status: V}
    - {name: ueberstand_flaechenziegel, wert: 30, einheit: mm, richtung: min, fundstelle: "FR 4.2 (4) (Gelbdruck)", status: U}
  meldung: "Am Ortgang {seite} beträgt der Abstand {ist} mm, gefordert sind {soll} mm."
  alternative:
    - {art: A2_kompensation, beschreibung: "Spaltenraster über die Deckbreite im zulässigen Bereich verschieben", frei: [deckung.deckbreite, deckung.ursprung_u]}
    - {art: A1_grenzwert, beschreibung: "Ortgangüberstand ändern", frei: [dach.ueberstand_ortgang]}
  status: U
  beispiel: [B21]
  kapitel: "14.3.5"
  anforderungen: [ANF-14-12]

- id: DE.ZVDH.DZ.Formziegel-Befestigung
  version: 0.1.0
  titel: Mechanische Befestigung von First- und Gratziegeln
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "1.4, 4.3, 4.4 (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcDiscreteAccessory mit ObjectType RIDGE oder HIP"
  eingaben:
    - {name: tragfaehigkeit_je_m, einheit: "kN/m", quelle: "Befestigungsmittel am Typ"}
    - {name: schraube_durchmesser, einheit: mm, quelle: Typ}
    - {name: einschraubtiefe, einheit: mm, quelle: Typ}
    - {name: befestigung_moertel, einheit: "-", quelle: Bemusterung}
  pruefung:
    typ: rechnung
    funktion: formziegel_befestigung@0.1
    formel: "jeder Formziegel mechanisch befestigt; Σ Tragfähigkeit je m >= 0,60 kN/m; bei Schraube: d >= 4,5 mm, Einschraubtiefe >= 24 mm; Mörtel zählt nicht"
    parameter: {tragfaehigkeit_min_kn_m: 0.60, schraube_d_mm: 4.5, einschraubtiefe_min_mm: 24}
  grenzwerte:
    - {name: tragfaehigkeit, wert: 0.60, einheit: "kN/m", richtung: min, fundstelle: "FR 1.4 (Gelbdruck)", status: U}
    - {name: einschraubtiefe, wert: 24, einheit: mm, richtung: min, fundstelle: "FR 4.3/4.4 (Gelbdruck)", status: U}
  meldung: "Die Befestigung am {kante} erreicht {ist:.2f} kN/m; gefordert sind 0,60 kN/m ohne Anrechnung von Mörtel."
  alternative:
    - {art: A3_variante, beschreibung: "Befestigungssystem des Herstellers für Trockenfirst wählen", frei: [first.befestigung]}
  status: U
  beispiel: [B21]
  kapitel: "14.3.5"
  anforderungen: [ANF-14-13]

- id: DE.ZVDH.DZ.Windsog-Klammerung
  version: 0.1.0
  titel: Klammerung der Flächenziegel gegen Windsog
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine; Hinweise zur Lastenermittlung", fundstelle: "1.4; Hinweise 4.2.2 (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcCovering ROOFING mit Dachziegeln oder Dachsteinen"
    r2_voraussetzung: [HRB-R2-Windsogberechnung]
  eingaben:
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: windsogberechnung, einheit: "-", quelle: "Nachweisdokument (lizenzierte Rechenhilfe)"}
  pruefung:
    typ: rechnung
    funktion: windsog_klammer@0.1
    formel: "wenn dachneigung > 65°: jeder Ziegel geklammert, sonst verletzt; sonst: ohne Windsogberechnung unbestimmt, mit Berechnung Klammerplan aus dem Nachweis"
    parameter: {grenzneigung_alle_klammern_grad: 65}
  grenzwerte:
    - {name: grenzneigung_alle_klammern, wert: 65, einheit: "°", richtung: max, fundstelle: "FR 1.4 (Gelbdruck)", status: U}
  meldung: "Für die Klammerung fehlt die objektspezifische Windsogberechnung; bei {DN}° ist sie nicht pauschal ableitbar."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "Windsogberechnung mit der Rechenhilfe des ZVDH oder des Herstellers als Nachweis beifügen"}
  status: U
  beispiel: [keins]
  kapitel: "14.3.5"
  anforderungen: [ANF-14-13]

- id: DE.ZVDH.DZ.Traglattung-Schutz
  version: 0.1.0
  titel: Schutz der Traglattung bei starker Unterschreitung der Regeldachneigung
  klasse: R1
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "1.2 (7) (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcCovering ROOFING; Ergebnis von DE.ZVDH.DZ.Dachneigung liegt vor"
  eingaben:
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: rdn_zvdh, einheit: "°", quelle: Datenblatt}
    - {name: massnahme_traglattung, einheit: "-", quelle: Modell}
  pruefung:
    typ: rechnung
    funktion: traglattung_schutz@0.1
    formel: "wenn rdn_zvdh - dachneigung > 12°: Maßnahme zum Schutz der Traglattung erforderlich, sonst nicht_anwendbar"
    parameter: {unterschreitung_grenze_grad: 12}
  grenzwerte:
    - {name: unterschreitung, wert: 12, einheit: "°", richtung: max, fundstelle: "FR 1.2 (7) (Gelbdruck)", status: U}
  meldung: "Die Regeldachneigung wird um {diff}° unterschritten (> 12°). Die Traglattung ist zu schützen."
  alternative:
    - {art: A2_kompensation, beschreibung: "Unterdach mit Schutz der Traglattung ausführen", frei: [unterdach.aufbau]}
    - {art: A1_grenzwert, beschreibung: "Dachneigung auf RDN - 12° erhöhen", frei: [dach.neigung]}
  status: U
  beispiel: [keins]
  kapitel: "14.3.3"
  anforderungen: [ANF-14-08]
  hinweis: "Testfall: RDN 30°, DN 17° -> Klasse K1 (DE.ZVDH.DZ.Dachneigung) und Maßnahme Traglattung."

- id: DE.ZVDH.DZ.Objektplanung
  version: 0.1.0
  titel: Objektplanung bei sehr langen Sparren und extremen Lagen
  klasse: R3
  haerte: hart
  quelle: {art: H, werk: "ZVDH-Fachregel Dachziegel und Dachsteine", fundstelle: "1.2 (5) (Gelbdruck 07/2023)", fassung: "2024-04", status: U, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: DE-Handwerk-Dach, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2024-04-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcSlab ROOF"
  eingaben:
    - {name: sparrenlaenge, einheit: m, quelle: Modell}
    - {name: extreme_lage, einheit: "-", quelle: Kontext}
  pruefung:
    typ: freigabe
    funktion: objektplanung_dach@0.1
    formel: "freigabepflichtig, wenn sparrenlaenge > 15 m oder extreme_lage; sonst nicht_anwendbar"
    parameter: {sparrenlaenge_grenze_m: 15}
  grenzwerte:
    - {name: sparrenlaenge, wert: 15, einheit: m, richtung: max, fundstelle: "FR 1.2 (5) (Gelbdruck)", status: U}
  meldung: "Sparrenlänge {L:.2f} m: Die Deckung ist objektbezogen zu planen."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "objektbezogene Planung durch den Dachdecker als Nachweis beifügen"}
  freigabe_rolle: Dachdecker-Fachbetrieb
  status: U
  beispiel: [keins]
  kapitel: "14.3.1"
  anforderungen: [ANF-14-08]

- id: M.Hersteller.RDN-Vereinbarung
  version: 0.1.0
  titel: Nutzung einer Hersteller-Regeldachneigung unterhalb der ZVDH-Regeldachneigung
  klasse: R3
  haerte: hart
  quelle: {art: M, werk: "Herstellerdatenblatt; ZVDH/DDH-Hinweis", fundstelle: "Recherche 09, Abschnitt 2 (ddh.de 2024)", fassung: "2024", status: V, bib: [zvdh2024], recherche: ["09"]}
  profil: {name: M-Hersteller-Dach, version: 0.1.0}
  schicht: S5
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: vertragsschluss}
  vorbedingung:
    auswahl: "IfcCovering ROOFING mit Datenblatt"
    anwendbar_wenn: "rdn_hersteller < rdn_zvdh"
  eingaben:
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: rdn_zvdh, einheit: "°", quelle: Datenblatt}
    - {name: rdn_hersteller, einheit: "°", quelle: Datenblatt}
    - {name: vereinbarung_dokument, einheit: "-", quelle: "IfcDocumentReference mit SHA-256"}
  pruefung:
    typ: freigabe
    funktion: rdn_vereinbarung@0.1
    formel: "wenn rdn_hersteller <= dachneigung < rdn_zvdh: freigabepflichtig, aufgelöst durch Freigabe der Firma mit vereinbarung_dokument; wenn dachneigung >= rdn_zvdh: nicht_anwendbar"
  grenzwerte: []
  meldung: "Die Dachneigung {DN}° liegt unter der ZVDH-Regeldachneigung {rdn_zvdh}°, aber über der Hersteller-Regeldachneigung {rdn_hersteller}°. Das ist nur mit vertraglicher Vereinbarung zulässig."
  alternative:
    - {art: A5_freigabeweg, beschreibung: "Vereinbarung der Hersteller-RDN mit dem Kunden dokumentieren und freigeben"}
    - {art: A4_schichtwechsel, beschreibung: "ohne Vereinbarung Zusatzmaßnahme nach ZVDH-Klasse ausführen"}
  freigabe_rolle: Firma
  status: V
  beispiel: [keins]
  kapitel: "14.3.1"
  anforderungen: [ANF-14-09]

- id: M.Hersteller.Lattweite
  version: 0.1.0
  titel: Lattungseinteilung aus dem Datenblatt des Ziegelmodells
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Verlegeanleitungen und Produktblätter (Braas, Erlus, Creaton)", fundstelle: "L = n·LA + LAT + LAF (Braas-Verlegeanleitung)", fassung: "abgerufen 2026-09-27", status: V, recherche: ["09"]}
  profil: {name: M-Hersteller-Dach, version: 0.1.0}
  schicht: S5
  geltung:
    raum: alle
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "jede IfcSlab ROOF mit IfcCovering ROOFING"
    r2_voraussetzung: [HRB-R2-Datenblatt-Dachziegel]
  eingaben:
    - {name: L, einheit: mm, quelle: Modell, beschreibung: "Konstruktionslänge Traufe bis First in Fallrichtung"}
    - {name: dachneigung, einheit: "°", quelle: Modell}
    - {name: la_bereich, einheit: mm, quelle: "Datenblatt je Neigung"}
    - {name: lat_bereich, einheit: mm, quelle: "Datenblatt je Neigung"}
    - {name: laf_bereich, einheit: mm, quelle: "Datenblatt je Neigung"}
  pruefung:
    typ: optimierung
    funktion: lattung@0.1
    formel: "Rest = L − LAT − LAF; n von ceil(Rest/LA_max) bis floor(Rest/LA_min); LA = Rest/n; kleinstes n mit LA_min <= LA <= LA_max; sonst Suche über LAT, LAF im Datenblattbereich (1 mm); sonst verletzt mit Grenzwerten für den Dachüberstand; fehlt ein Datenblattwert: unbestimmt"
    parameter: {suchraster_mm: 1}
  grenzwerte: []
  meldung: "Für {modell} gibt es bei L = {L} mm keine zulässige Lattweite ({la_min}–{la_max} mm). Zulässig wäre ein Dachüberstand bis {u_max} m oder ab {u_min} m."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Dachüberstand auf den nächsten zulässigen Wert ändern", frei: [dach.ueberstand_traufe]}
    - {art: A3_variante, beschreibung: "anderes Ziegelmodell oder Dachneigung", frei: [bemusterung.deckung, dach.neigung]}
  status: U
  beispiel: [B21]
  kapitel: "14.3.3"
  anforderungen: [ANF-14-10]
  hinweis: "Testfall Beispiel 14.3 (eigene Rechnung): Linea LA 373-393, LAT 370, LAF 40 (Annahme): L 6000 und L 6714 ohne Lösung; Überstand <= 0,486 m (n = 16) oder >= 0,531 m (n = 17)."

- id: M.Hersteller.Eindeckrahmen
  version: 0.1.0
  titel: Kompatibilität von Eindeckrahmen, Deckungsprofil und Dachneigung
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Velux Eindeckrahmen EDW/EDJ/EDZ/EDN", fundstelle: "Herstellerunterlagen (Recherche 09, Abschnitt 3)", fassung: "abgerufen 2026-09-27", status: V, recherche: ["09"]}
  profil: {name: M-Hersteller-Dach, version: 0.1.0}
  schicht: S5
  geltung:
    raum: alle
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "IfcWindow SKYLIGHT mit IfcDiscreteAccessory FLASHING"
  eingaben:
    - {name: rahmen_typ, einheit: "-", quelle: Bemusterung}
    - {name: profilhoehe_deckung, einheit: mm, quelle: Datenblatt}
    - {name: dachneigung, einheit: "°", quelle: Modell}
  pruefung:
    typ: aufzaehlung
    funktion: eindeckrahmen@0.1
    formel: "EDW: 15 <= profilhoehe <= 120 mm und 15° <= DN <= 90°; EDJ: profilhoehe <= 90 mm und 20° <= DN <= 90°; EDZ/EDN: profilhoehe <= 16 mm; Werte je Rahmentyp aus Datenblatt"
    parameter: {EDW: {profil_mm: [15, 120], dn_grad: [15, 90]}, EDJ: {profil_mm: [0, 90], dn_grad: [20, 90]}, EDZ: {profil_mm: [0, 16]}}
  grenzwerte:
    - {name: EDW_dachneigung, wert: [15, 90], einheit: "°", richtung: intervall, fundstelle: "Velux (Recherche 09)", status: V}
    - {name: EDJ_dachneigung, wert: [20, 90], einheit: "°", richtung: intervall, fundstelle: "Velux (Recherche 09)", status: V}
  meldung: "Der Eindeckrahmen {rahmen_typ} passt nicht zu Profilhöhe {profil} mm und Dachneigung {DN}°."
  alternative:
    - {art: A3_variante, beschreibung: "passenden Eindeckrahmen wählen", frei: [dachfenster.eindeckrahmen]}
  status: V
  beispiel: [keins]
  kapitel: "14.4.1"
  anforderungen: [ANF-14-16]

- id: M.Hersteller.Dachfenster-Wechsel
  version: 0.1.0
  titel: Sparrenabstand und Wechselabstände am Dachfenster
  klasse: R1
  haerte: hart
  quelle: {art: M, werk: "Velux Einbauhinweise und Tabelle Wechselabstände", fundstelle: "Recherche 09, Abschnitt 3", fassung: "abgerufen 2026-09-27", status: V, recherche: ["09"]}
  profil: {name: M-Hersteller-Dach, version: 0.1.0}
  schicht: S5
  geltung:
    raum: alle
    gebaeudetypen: [alle]
    zeit: {von: null, bis: null, stichtag: pruefzeitpunkt}
  vorbedingung:
    auswahl: "IfcWindow SKYLIGHT"
  eingaben:
    - {name: blendrahmenbreite, einheit: mm, quelle: Typ}
    - {name: lichtes_sparrenmass, einheit: mm, quelle: Modell}
    - {name: daemmrahmen_bdx, einheit: "-", quelle: Bemusterung}
    - {name: dachdicke, einheit: mm, quelle: Modell}
    - {name: dachneigung, einheit: "°", quelle: Modell}
  pruefung:
    typ: rechnung
    funktion: dachfenster_wechsel@0.1
    formel: "passt ohne Wechsel, wenn lichtes_sparrenmass >= blendrahmenbreite + 60 mm (mit BDX + 40 bis 50 mm); sonst erst Verschiebung < halbe Sparrenteilung prüfen, dann Wechsel mit Abständen oben/unten aus Herstellertabelle (dachdicke, dachneigung)"
    parameter: {zuschlag_ohne_bdx_mm: 60, zuschlag_mit_bdx_mm: [40, 50]}
  grenzwerte:
    - {name: zuschlag_sparrenmass, wert: 60, einheit: mm, richtung: min, fundstelle: "Velux (Recherche 09)", status: V}
  meldung: "Das Dachfenster passt nicht zwischen die Sparren ({ist} mm < {soll} mm). Vorschlag: {vorschlag}."
  alternative:
    - {art: A1_grenzwert, beschreibung: "Fenster um weniger als eine halbe Sparrenteilung verschieben", frei: [dachfenster.lage_u]}
    - {art: A2_kompensation, beschreibung: "Wechsel mit Abständen aus der Herstellertabelle einbauen", frei: [tragwerk.wechsel]}
  status: V
  beispiel: [keins]
  kapitel: "14.4.1"
  anforderungen: [ANF-14-17]
  hinweis: "Testfall: Dachdicke 20 cm, 45°: Wechselabstand oben und unten 21,1 cm (Velux-Tabelle, einschließlich 10 cm Sicherheit)."

