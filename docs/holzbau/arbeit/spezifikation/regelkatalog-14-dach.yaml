    - {name: lichte_hoehe, wert: 1.00, einheit: m, richtung: min, fundstelle: "Art. 35 Abs. 4", status: V}
    - {name: unterkante, wert: 1.20, einheit: m, richtung: max, fundstelle: "Art. 35 Abs. 4", status: V}
    - {name: abstand_traufkante, wert: 1.00, einheit: m, richtung: max, fundstelle: "Art. 35 Abs. 4", status: V}
  meldung: "Das Rettungsfenster in {raum} erfüllt {kriterium} nicht ({ist} statt {soll})."
  alternative:
    - {art: A3_variante, beschreibung: "größeres Fenster desselben Herstellers wählen", frei: [dachfenster.typ]}
    - {art: A1_grenzwert, beschreibung: "Fenster näher an die Traufe oder tiefer setzen", frei: [dachfenster.lage_v]}
  status: V
  beispiel: [keins]
  kapitel: "14.4.1"
  anforderungen: [ANF-14-14]

