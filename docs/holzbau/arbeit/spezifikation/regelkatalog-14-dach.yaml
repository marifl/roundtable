    formel: "lichte_breite >= 0,60 m ∧ lichte_hoehe >= 1,00 m ∧ von_innen_zu_oeffnen ∧ unterkante_ueber_fussboden <= 1,20 m ∧ (keine Dachschräge ∨ abstand_traufkante_horizontal <= 1,00 m)"
    parameter: {breite_min_m: 0.60, hoehe_min_m: 1.00, unterkante_max_m: 1.20, abstand_traufe_max_m: 1.00}
  grenzwerte:
