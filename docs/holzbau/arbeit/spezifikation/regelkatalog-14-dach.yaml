- id: DE.DIN1986-100.Dachentwaesserung
  version: 0.1.0
  titel: Bemessung von Rinne und Fallrohr mit r(5,5)
  klasse: R1
  haerte: hart
  quelle: {art: N, werk: "DIN 1986-100; DIN EN 12056-3", fundstelle: "Berechnungsregen Dach r(5,5); Q = r·C·A/10000; Tab. 9", fassung: "2016-12", status: V, recherche: ["09", "18"]}
  profil: {name: DE-aRdT-Sanitaer, version: 0.1.0}
  schicht: S3
  geltung:
    raum: Deutschland
    gebaeudetypen: [alle]
    zeit: {von: "2016-12-01", bis: null, stichtag: abnahme}
  vorbedingung:
    auswahl: "IfcDistributionSystem RAINWATER mit IfcPipeSegment GUTTER und RIGIDSEGMENT"
    r2_voraussetzung: [HRB-R2-KOSTRA-Rasterfeld]
  eingaben:
    - {name: A_proj, einheit: "m²", quelle: Modell, beschreibung: "projizierte Einzugsfläche je Fallrohr"}
    - {name: C, einheit: "-", quelle: Parameter, beschreibung: "1,0 für Dachflächen"}
    - {name: r_5_5, einheit: "l/(s·ha)", quelle: "KOSTRA-DWD-2020"}
    - {name: r_5_2, einheit: "l/(s·ha)", quelle: "KOSTRA-DWD-2020", beschreibung: "nur Vergleich"}
    - {name: Q_zul_rinne, einheit: "l/s", quelle: "Hersteller oder DIN EN 12056-3"}
    - {name: DN_fallrohr, einheit: mm, quelle: Modell}
  pruefung:
    typ: rechnung
    funktion: dachentwaesserung@0.1
    formel: "Q = r_5_5 · C · A_proj / 10000; erfuellt, wenn Q <= Q_zul_rinne und Q <= Q_zul_fallrohr und DN_fallrohr >= 75; ohne r_5_5: unbestimmt; Nachweis weist Q(r_5_2) zusätzlich aus"
    parameter: {C_dach: 1.0, dn_fallrohr_min_mm: 75}
  grenzwerte:
    - {name: dn_fallrohr, wert: 75, einheit: mm, richtung: min, fundstelle: "Fachliteratur zu DIN EN 12056-3 (Recherche 09)", status: U}
  meldung: "Das Fallrohr {id} erhält {Q:.2f} l/s bei r(5,5) = {r} l/(s·ha); zulässig sind {Q_zul:.2f} l/s."
  alternative:
    - {art: A3_variante, beschreibung: "größere Rinne oder zusätzliches Fallrohr", frei: [entwaesserung.rinne, entwaesserung.fallrohre]}
  status: V
  beispiel: [B17]
  kapitel: "14.5"
  anforderungen: [ANF-14-19]
  tests: [tests/test_b17.py::test_regenabfluss]
  hinweis: "Referenz: 35,75 m², r = 290 l/(s·ha) (r(5,2) aus B17) -> 1,04 l/s je Fallrohr. Abweichende Rinnenpraxis mit r(5,2) ist im Nachweis zu dokumentieren (E14.9)."

